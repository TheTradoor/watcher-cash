name: Apply Watcher Browser UI Migration

on:
  workflow_dispatch:
  push:
    branches: [watcher-protocol]
    paths:
      - 'config/watcher-page-entry.jsx'
      - 'config/watcher-index.mjs'
      - 'config/watcher-pages-v2.yml'
      - 'config/watcher-ui-ci.yml'
      - 'config/watcher-patch-workflow.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Apply staged browser UI files
        run: |
          cp config/watcher-page-entry.jsx app/page.jsx
          cp config/watcher-index.mjs client/watcher/index.mjs
          cp config/watcher-pages-v2.yml .github/workflows/pages.yml
          cp config/watcher-ui-ci.yml .github/workflows/watcher-ui.yml
          cp config/watcher-patch-workflow.yml .github/workflows/patch-watcher-ui.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test browser client and static site
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          node --test client/watcher/*.test.mjs
          node --check public/watcher-prover-worker.js
          npm run build

      - name: Test native and WebAssembly prover builds
        working-directory: circuits/withdraw
        run: |
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover.wasm ./cmd/watcher-prover-wasm

      - name: Commit migrated route and pipelines
        run: |
          if git diff --quiet; then
            echo 'Watcher browser UI migration is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx client/watcher/index.mjs .github/workflows/pages.yml .github/workflows/watcher-ui.yml .github/workflows/patch-watcher-ui.yml
          git commit -m 'Wire Watcher browser proofs into the live UI'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
