name: Apply Watcher Browser Prover Go Patch

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'scripts/apply-browser-prover-go-patch.mjs'
      - '.github/workflows/apply-browser-prover-go-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-watcher-browser-prover-go-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Apply in-memory bundle loader patch
        run: node scripts/apply-browser-prover-go-patch.mjs

      - name: Format and test Go prover code
        working-directory: circuits/withdraw
        run: |
          gofmt -w prover_v1.go cmd/watcher-setup/main.go cmd/watcher-prover-wasm/main.go
          go mod tidy
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-prover.wasm

      - name: Commit browser prover Go support
        run: |
          if git diff --quiet; then
            echo 'Browser prover Go support is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            circuits/withdraw/go.mod \
            circuits/withdraw/go.sum \
            circuits/withdraw/prover_v1.go \
            circuits/withdraw/cmd/watcher-setup/main.go \
            circuits/withdraw/cmd/watcher-prover-wasm/main.go
          git commit -m 'Load matched proving bundles inside browser WebAssembly'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
