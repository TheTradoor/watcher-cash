name: Refresh Watcher Rust Lockfile

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'programs/watcher-protocol/Cargo.toml'
      - 'programs/watcher-protocol/src/**'
      - '.github/workflows/refresh-rust-lock.yml'

permissions:
  contents: write

concurrency:
  group: watcher-refresh-rust-lock
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh lockfile through a normal program check
        run: cargo check --manifest-path programs/watcher-protocol/Cargo.toml

      - name: Verify the refreshed lockfile
        run: cargo test --manifest-path programs/watcher-protocol/Cargo.toml --all-targets --locked

      - name: Commit refreshed Rust lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- programs/watcher-protocol/Cargo.lock; then
            echo 'Cargo.lock already matches Cargo.toml'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/watcher-protocol/Cargo.lock
          git commit -m 'Refresh locked Watcher program dependencies'
          git fetch origin watcher-protocol
          git rebase origin/watcher-protocol
          git push origin HEAD:watcher-protocol
