name: Fix Watcher Browser Deposit Transition

# Retry after removing the obsolete duplicate Go bundle loader.
on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/fix-watcher-browser-deposit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Wire the live registry into browser deposits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/watcher-protocol-page.jsx')
          source = path.read_text()

          old_import = "\n".join([
              "import {",
              "  BN254_SCALAR_MODULUS,",
              "  bytesToBigIntLE,",
              "  bytesToHex,",
              "  CONFIG_ACCOUNT_LEN_V1,",
              "  COMMITMENT_REGISTRY_LEN_V1,",
              "  deriveVaultAddressV1,",
              "  buildInitializeInstructionV1,",
              "  NULLIFIER_REGISTRY_LEN_V1,",
              "  ROOT_HISTORY_ACCOUNT_LEN_V1,",
              "  VAULT_ACCOUNT_LEN_V1,",
              "  noteCommitmentV1,",
              "  nullifierV1,",
              "} from '../client/watcher/index.mjs';",
          ])
          new_import = "\n".join([
              "import { bytesToHex } from '../client/watcher/keccak.mjs';",
              "import {",
              "  BN254_SCALAR_MODULUS,",
              "  bytesToBigIntLE,",
              "  noteCommitmentV1,",
              "  nullifierV1,",
              "} from '../client/watcher/field.mjs';",
              "import {",
              "  CONFIG_ACCOUNT_LEN_V1,",
              "  COMMITMENT_REGISTRY_LEN_V1,",
              "  deriveVaultAddressV1,",
              "  buildInitializeInstructionV1,",
              "  NULLIFIER_REGISTRY_LEN_V1,",
              "  ROOT_HISTORY_ACCOUNT_LEN_V1,",
              "  VAULT_ACCOUNT_LEN_V1,",
              "} from '../client/watcher/instructions.mjs';",
          ])
          if source.count(old_import) != 1:
              raise SystemExit('Watcher page import block is not in the expected state')
          source = source.replace(old_import, new_import, 1)

          old_call = "      const prepared = await prepareUiDepositV1({\n        accounts: {"
          new_call = "      const prepared = await prepareUiDepositV1({\n        connection,\n        accounts: {"
          if source.count(old_call) != 1:
              raise SystemExit('Watcher deposit call is not in the expected state')
          source = source.replace(old_call, new_call, 1)
          path.write_text(source)
          PY

      - name: Validate browser, client, native prover, and WASM
        shell: bash
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check public/watcher-prover-worker.js
          npm run build
          cd circuits/withdraw
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover-browser-fix.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-prover-browser-fix.wasm

      - name: Publish the validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/watcher-protocol-page.jsx client/watcher/ui-flows.mjs client/watcher/ui-flows.test.mjs
          git rm .github/workflows/fix-watcher-browser-deposit.yml
          git commit -m 'Derive browser deposit transitions from live state'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
