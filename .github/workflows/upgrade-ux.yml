name: Upgrade Watcher Cash UX

on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-ux.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text()

          def rep(old, new, name):
              global s
              if old not in s:
                  raise SystemExit(f'missing marker: {name}')
              s = s.replace(old, new, 1)

          rep("  const [debugDetail, setDebugDetail] = useState('');\n", "  const [debugDetail, setDebugDetail] = useState('');\n  const [relayerStatus, setRelayerStatus] = useState('checking');\n  const [relayerConfig, setRelayerConfig] = useState(null);\n  const [history, setHistory] = useState([]);\n", 'states')

          rep("  useEffect(() => {\n    setBalance(null);\n    setTx('');\n  }, [tokenName]);", "  useEffect(() => {\n    let cancelled = false;\n    const checkRelayer = async () => {\n      try {\n        const response = await fetch(`${RELAYER}/config`, { cache: 'no-store' });\n        if (!response.ok) throw new Error(`Relayer HTTP ${response.status}`);\n        const config = await response.json();\n        if (!cancelled) {\n          setRelayerConfig(config);\n          setRelayerStatus('online');\n        }\n      } catch {\n        if (!cancelled) setRelayerStatus('offline');\n      }\n    };\n    checkRelayer();\n    const timer = setInterval(checkRelayer, 30000);\n    return () => { cancelled = true; clearInterval(timer); };\n  }, []);\n\n  useEffect(() => {\n    setBalance(null);\n    setTx('');\n  }, [tokenName]);", 'relayer effect')

          rep("  }, [publicKey]);\n\n  const encryption", "  }, [publicKey]);\n\n  useEffect(() => {\n    if (!publicKey) { setHistory([]); return; }\n    try {\n      const saved = localStorage.getItem(`watcher-cash-history:${publicKey.toBase58()}`);\n      setHistory(saved ? JSON.parse(saved) : []);\n    } catch {\n      setHistory([]);\n    }\n  }, [publicKey]);\n\n  const encryption", 'history effect')

          rep("  const submit = async () => {", "  const numericAmount = Number(normalizeAmount(amount)) || 0;\n  const feeRate = Number(relayerConfig?.withdraw_fee_rate || 0);\n  const rentFee = tokenName === 'sol'\n    ? Number(relayerConfig?.withdraw_rent_fee || 0)\n    : Number(relayerConfig?.rent_fees?.[tokenName] || 0);\n  const estimatedFee = mode === 'withdraw' && numericAmount > 0 ? (numericAmount * feeRate) + rentFee : 0;\n  const estimatedReceive = Math.max(0, numericAmount - estimatedFee);\n  const minimumWithdrawal = Number(relayerConfig?.minimum_withdrawal?.[tokenName] || 0);\n  const belowMinimum = mode === 'withdraw' && minimumWithdrawal > 0 && numericAmount > 0 && numericAmount < minimumWithdrawal;\n\n  const setMaxAmount = () => {\n    if (balance !== null && balance > 0) setAmount(String(balance));\n  };\n\n  const stageCopy = {\n    Idle: 'Ready',\n    'Checking RPC': 'Checking network',\n    'Loading SDK': 'Loading privacy engine',\n    'Loading ZK engine': 'Loading ZK engine',\n    'Validating amount': 'Checking amount',\n    'Building proof': 'Generating ZK proof',\n    'Waiting for Phantom': 'Waiting for wallet approval',\n    Broadcasting: 'Submitting transaction',\n    Confirmed: 'Confirmed',\n    Failed: 'Transaction stopped',\n  };\n\n  const submit = async () => {", 'derived ux')

          rep("      const units = toBaseUnits(amount, tokenMeta.decimals);", "      const submittedAmount = normalizeAmount(amount);\n      const units = toBaseUnits(amount, tokenMeta.decimals);\n      if (mode === 'withdraw') {\n        if (relayerStatus !== 'online') throw new Error('Relayer is currently unavailable. Try again shortly.');\n        if (estimatedReceive <= 0) throw new Error('Amount is too low after protocol fees.');\n        if (belowMinimum) throw new Error(`Minimum ${tokenMeta.label} withdrawal is ${minimumWithdrawal}.`);\n        if (balance !== null && numericAmount > balance) throw new Error('Amount exceeds your private balance.');\n      }", 'submit validation')

          rep("      setTx(result.tx);\n      setAmount('');", "      setTx(result.tx);\n      if (result?.tx && publicKey) {\n        const entry = {\n          tx: result.tx,\n          type: mode,\n          token: tokenMeta.label,\n          amount: submittedAmount,\n          recipient: mode === 'withdraw' ? recipient : null,\n          time: Date.now(),\n        };\n        setHistory((previous) => {\n          const next = [entry, ...previous.filter((item) => item.tx !== entry.tx)].slice(0, 8);\n          localStorage.setItem(`watcher-cash-history:${publicKey.toBase58()}`, JSON.stringify(next));\n          return next;\n        });\n      }\n      setAmount('');", 'history save')

          rep("  const actionReady = connected && signature && sdkReady && network !== 'wrong-network' && !busy && normalizeAmount(amount).length > 0;", "  const withdrawReady = mode !== 'withdraw' || (relayerStatus === 'online' && estimatedReceive > 0 && !belowMinimum && (balance === null || numericAmount <= balance));\n  const actionReady = connected && signature && sdkReady && network !== 'wrong-network' && !busy && normalizeAmount(amount).length > 0 && withdrawReady;", 'action ready')

          rep("              <span>● RELAYER</span>", "              <span className={relayerStatus === 'online' ? 'ok' : relayerStatus === 'offline' ? 'bad' : ''}>● RELAYER {relayerStatus === 'online' ? 'LIVE' : relayerStatus === 'offline' ? 'OFFLINE' : 'CHECKING'}</span>", 'relayer badge')

          rep("                <div className=\"amount-field\"><input inputMode=\"decimal\" value={amount} onChange={(e) => setAmount(e.target.value.replace(',', '.'))} placeholder=\"0.00\" /><span>{tokenMeta.label}</span></div>", "                <div className=\"amount-field\"><input inputMode=\"decimal\" value={amount} onChange={(e) => setAmount(e.target.value.replace(',', '.'))} placeholder=\"0.00\" />{mode === 'withdraw' && balance !== null && <button type=\"button\" className=\"max-button\" onClick={setMaxAmount}>MAX</button>}<span>{tokenMeta.label}</span></div>", 'max button')

          rep("                {mode === 'withdraw' && (\n                  <>\n                    <label>Recipient</label>\n                    <input className=\"recipient-field\" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder=\"Solana address\" />\n                  </>\n                )}", "                {mode === 'withdraw' && (\n                  <>\n                    <label>Recipient</label>\n                    <input className=\"recipient-field\" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder=\"Solana address\" />\n                    <div className=\"fee-card\">\n                      <div><span>Private balance</span><strong>{balance === null ? '—' : `${balance.toLocaleString(undefined, { maximumFractionDigits: 6 })} ${tokenMeta.label}`}</strong></div>\n                      <div><span>Protocol fee</span><strong>{relayerConfig && numericAmount > 0 ? `~${estimatedFee.toLocaleString(undefined, { maximumFractionDigits: 6 })} ${tokenMeta.label}` : 'Enter amount'}</strong></div>\n                      <div className=\"receive-row\"><span>You receive</span><strong>{relayerConfig && numericAmount > 0 ? `~${estimatedReceive.toLocaleString(undefined, { maximumFractionDigits: 6 })} ${tokenMeta.label}` : '—'}</strong></div>\n                      {minimumWithdrawal > 0 && <small>Protocol minimum: {minimumWithdrawal} {tokenMeta.label}</small>}\n                      {belowMinimum && <small className=\"fee-warning\">Amount is below the current protocol minimum.</small>}\n                    </div>\n                  </>\n                )}", 'fee card')

          old_debug = "                <div style={{margin:'12px 0',padding:'12px 14px',border:'1px solid #ddd',borderRadius:16,background:'#f7f6f2',fontSize:13,lineHeight:1.45,color:'#222'}}>\n                  <strong style={{display:'block',marginBottom:4}}>Stage: {debugStage}</strong>\n                  {debugDetail && <div style={{whiteSpace:'pre-wrap',wordBreak:'break-word',maxHeight:140,overflow:'auto',fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace',fontSize:11}}>{debugDetail}</div>}\n                </div>"
          new_debug = "                <div className={`stage-card ${debugStage === 'Confirmed' ? 'stage-success' : debugStage === 'Failed' ? 'stage-failed' : ''}`}>\n                  <div className=\"stage-top\"><span className=\"stage-dot\" /><strong>{stageCopy[debugStage] || debugStage}</strong></div>\n                  <small>{debugStage === 'Building proof' ? 'Proof generation can take a moment on mobile.' : debugStage === 'Waiting for Phantom' ? 'Approve the request in your wallet.' : debugStage === 'Confirmed' ? 'Your private transaction has been indexed.' : debugStage === 'Failed' ? 'Nothing else was submitted after this error.' : 'Watcher Cash will update this automatically.'}</small>\n                  {debugDetail && <details><summary>Technical details</summary><pre>{debugDetail}</pre></details>}\n                </div>"
          rep(old_debug, new_debug, 'stage card')

          rep("            {tx && <a className=\"tx-link\" href={`https://solscan.io/tx/${tx}`} target=\"_blank\" rel=\"noreferrer\">Transaction confirmed · View on Solscan ↗</a>}\n            <p className=\"mainnet-warning\">", "            {tx && <a className=\"tx-link receipt-link\" href={`https://solscan.io/tx/${tx}`} target=\"_blank\" rel=\"noreferrer\"><strong>✓ Transaction confirmed</strong><span>View receipt on Solscan ↗</span></a>}\n            {history.length > 0 && <div className=\"history-card\"><div className=\"history-head\"><strong>Recent activity</strong><small>Stored on this device</small></div>{history.slice(0, 5).map((item) => <a key={item.tx} href={`https://solscan.io/tx/${item.tx}`} target=\"_blank\" rel=\"noreferrer\"><div><b>{item.type === 'deposit' ? 'Deposit' : 'Withdraw'} {item.token}</b><span>{item.amount} {item.token}</span></div><small>{new Date(item.time).toLocaleString()} ↗</small></a>)}</div>}\n            <p className=\"mainnet-warning\">", 'history ui')

          rep("  if (/insufficient/i.test(text)) return 'Insufficient wallet or private balance.';", "  if (/no enough balance|not enough balance/i.test(text)) return 'Private balance is too low after protocol fees.';\n  if (/insufficient/i.test(text)) return 'Insufficient wallet or private balance.';", 'friendly balance error')

          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          c += """\n\n/* Watcher Cash transaction UX */\n.max-button{border:0;background:#1f1f1f;color:#fff;border-radius:999px;padding:7px 10px;margin-right:8px;font-size:9px;font-weight:700}.fee-card{margin-top:12px;padding:13px;border:1px solid #d9d8d3;border-radius:14px;background:#f7f6f2}.fee-card>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;font-size:10px;color:#777}.fee-card strong{color:#222;font-size:10px}.fee-card .receive-row{border-top:1px solid #dddcd6;margin-top:5px;padding-top:10px}.fee-card .receive-row strong{font-size:13px;color:#111}.fee-card>small{display:block;margin-top:7px;color:#888;font-size:9px}.fee-card .fee-warning{color:#a24740}.stage-card{margin:12px 0;padding:13px 14px;border:1px solid #ddd;border-radius:16px;background:#f7f6f2;color:#222}.stage-top{display:flex;align-items:center;gap:8px}.stage-dot{width:8px;height:8px;border-radius:50%;background:#999;box-shadow:0 0 0 4px rgba(0,0,0,.04)}.stage-card strong{font-size:12px}.stage-card>small{display:block;margin:7px 0 0 16px;color:#777;font-size:9px;line-height:1.5}.stage-success{background:#edf5ea;border-color:#cfe1ca}.stage-success .stage-dot{background:#4e9147}.stage-failed{background:#fff0ee;border-color:#ebd0cd}.stage-failed .stage-dot{background:#b64e47}.stage-card details{margin:10px 0 0 16px}.stage-card summary{font-size:9px;color:#777;cursor:pointer}.stage-card pre{white-space:pre-wrap;word-break:break-word;max-height:130px;overflow:auto;font:9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#555}.receipt-link{display:flex;align-items:center;justify-content:space-between;gap:12px}.receipt-link strong{font-size:11px}.receipt-link span{font-size:9px}.history-card{margin-top:10px;border:1px solid #d9d8d3;border-radius:14px;background:#fff;overflow:hidden}.history-head{padding:12px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e3de}.history-head strong{font-size:11px}.history-head small{font-size:8px;color:#999}.history-card>a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border-bottom:1px solid #efeee9}.history-card>a:last-child{border-bottom:0}.history-card>a div{display:flex;flex-direction:column;gap:3px}.history-card>a b{font-size:10px}.history-card>a span,.history-card>a>small{font-size:8px;color:#888}@media(max-width:760px){.fee-card{padding:12px}.receipt-link{align-items:flex-start;flex-direction:column}.history-card>a{align-items:flex-start}}\n"""
          css.write_text(c)
          PY

      - name: Commit upgrade
        run: |
          git config user.name "Watcher Cash Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.jsx app/globals.css
          git commit -m "Upgrade Watcher Cash transaction UX"
          git push
