name: Request Watcher V2 Devnet Deployment

on:
  push:
    branches: [watcher-protocol-v2]
    paths:
      - '.github/v2-devnet-deploy-request'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent V2 devnet workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run watcher-v2-persistent-devnet.yml
          --repo "$GITHUB_REPOSITORY"
          --ref watcher-protocol-v2
          -f force_bootstrap=false
          -f acknowledge_nonzero_reset=false
          -f run_e2e=true
