name: Test Watcher Devnet Proof-of-Work Funding

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/test-watcher-pow-funding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pow-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Agave CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/anza-xyz/agave/releases/download/v4.0.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            -o /tmp/agave.tar.bz2
          mkdir -p /tmp/agave
          tar -xjf /tmp/agave.tar.bz2 -C /tmp/agave --strip-components=1
          echo "/tmp/agave/bin" >> "$GITHUB_PATH"

      - name: Install the Solana proof-of-work faucet client
        shell: bash
        run: |
          set -euo pipefail
          cargo install devnet-pow --version 0.1.4 --locked
          devnet-pow --version

      - name: Bootstrap transaction fees and mine a test reward
        shell: bash
        run: |
          set -euo pipefail
          PAYER=/tmp/watcher-pow-test.json
          trap 'rm -f "$PAYER"' EXIT
          solana-keygen new --silent --no-bip39-passphrase --force --outfile "$PAYER"
          ADDRESS=$(solana address --keypair "$PAYER")
          echo "Temporary test address: $ADDRESS"

          funded=0
          for amount in 0.001 0.0005 0.0001 0.00005 0.00001; do
            echo "Trying fee bootstrap airdrop: $amount SOL"
            solana airdrop "$amount" "$ADDRESS" --url https://api.devnet.solana.com --commitment confirmed || true
            balance=$(solana balance "$ADDRESS" --url https://api.devnet.solana.com --lamports 2>/dev/null | awk '{print $1}' || true)
            balance=${balance:-0}
            echo "Balance after bootstrap attempt: $balance lamports"
            if [ "$balance" -ge 10000 ]; then
              funded=1
              break
            fi
            sleep 3
          done

          if [ "$funded" -ne 1 ]; then
            echo 'Tiny fee bootstrap was rate-limited before proof-of-work mining could start.' >&2
            exit 1
          fi

          devnet-pow \
            --keypair-path "$PAYER" \
            --url devnet \
            mine \
            --difficulty 3 \
            --reward 0.02 \
            --no-infer \
            --target-lamports 20000000

          final_balance=$(solana balance "$ADDRESS" --url https://api.devnet.solana.com --lamports | awk '{print $1}')
          echo "Final test balance: $final_balance lamports"
          test "$final_balance" -ge 19000000
