name: Deploy Watcher Protocol to GitHub Pages

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'app/**'
      - 'client/watcher/**'
      - 'circuits/withdraw/**'
      - 'programs/watcher-protocol/**'
      - 'public/watcher-protocol/devnet.json'
      - 'scripts/test-browser-prover-wasm.mjs'
      - 'scripts/watcher-runtime-verify.mjs'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NEXT_PUBLIC_BASE_PATH: /watcher-cash
  NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
  NEXT_PUBLIC_WATCHER_RUNTIME_URL: /watcher-cash/watcher-protocol/devnet.json
  NEXT_PUBLIC_WATCHER_PROVER_BASE: /watcher-cash/watcher-prover

concurrency:
  group: watcher-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Watcher protocol branch
        uses: actions/checkout@v4
        with:
          ref: watcher-protocol

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Install web dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify published persistent devnet runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=public/watcher-protocol/devnet.json
          test -s "$RUNTIME"
          test "$(jq -r '.status' "$RUNTIME")" = ready
          test "$(jq -r '.cluster' "$RUNTIME")" = devnet
          test -n "$(jq -r '.programId' "$RUNTIME")"
          test -n "$(jq -r '.config' "$RUNTIME")"
          test -n "$(jq -r '.commitments' "$RUNTIME")"
          test -n "$(jq -r '.nullifiers' "$RUNTIME")"
          test -n "$(jq -r '.rootHistory' "$RUNTIME")"
          test -n "$(jq -r '.vault' "$RUNTIME")"
          test -n "$(jq -r '.proverBundleSha256' "$RUNTIME")"
          node scripts/watcher-runtime-verify.mjs \
            --runtime "$RUNTIME" \
            --rpc https://api.devnet.solana.com

      - name: Download synchronized matched prover bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/watcher-pages-release /tmp/watcher-pages-extract circuits/withdraw/fixture-out/pages-prover
          mkdir -p /tmp/watcher-pages-release /tmp/watcher-pages-extract circuits/withdraw/fixture-out/pages-prover
          gh release download watcher-dev-prover \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'watcher-development-prover-bundle.tar.gz' \
            --pattern 'watcher-development-prover-bundle.tar.gz.sha256' \
            --dir /tmp/watcher-pages-release
          (
            cd /tmp/watcher-pages-release
            sha256sum --check watcher-development-prover-bundle.tar.gz.sha256
          )
          ARCHIVE_SHA=$(sha256sum /tmp/watcher-pages-release/watcher-development-prover-bundle.tar.gz | awk '{print $1}')
          RUNTIME_SHA=$(jq -r '.proverBundleSha256' public/watcher-protocol/devnet.json)
          if [ "$ARCHIVE_SHA" != "$RUNTIME_SHA" ]; then
            echo "Published runtime expects prover $RUNTIME_SHA but synchronized release is $ARCHIVE_SHA" >&2
            exit 1
          fi
          tar -xzf /tmp/watcher-pages-release/watcher-development-prover-bundle.tar.gz -C /tmp/watcher-pages-extract
          BUNDLE_DIR=$(dirname "$(find /tmp/watcher-pages-extract -type f -name deposit.r1cs -print -quit)")
          test -n "$BUNDLE_DIR"
          cp -a "$BUNDLE_DIR/." circuits/withdraw/fixture-out/pages-prover/
          for name in deposit.r1cs deposit.pk deposit.vk withdraw.r1cs withdraw.pk withdraw.vk manifest.json; do
            test -s "circuits/withdraw/fixture-out/pages-prover/$name"
          done

      - name: Build browser-local prover wasm
        working-directory: circuits/withdraw
        shell: bash
        run: |
          set -euo pipefail
          GOOS=js GOARCH=wasm go build \
            -trimpath \
            -ldflags='-s -w' \
            -o fixture-out/pages-prover/watcher-prover.wasm \
            ./cmd/watcher-prover-wasm
          WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          if [ ! -f "$WASM_EXEC" ]; then
            WASM_EXEC="$(go env GOROOT)/misc/wasm/wasm_exec.js"
          fi
          test -f "$WASM_EXEC"
          cp "$WASM_EXEC" fixture-out/pages-prover/wasm_exec.js

      - name: Verify browser-local proving and client
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-browser-prover-wasm.mjs \
            circuits/withdraw/fixture-out/pages-prover \
            circuits/withdraw/fixture-out/pages-prover/watcher-prover.wasm \
            circuits/withdraw/fixture-out/pages-prover/wasm_exec.js
          npm run test:watcher-client

      - name: Assemble matched browser prover assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/watcher-prover
          mkdir -p public/watcher-prover/assets
          cp circuits/withdraw/fixture-out/pages-prover/watcher-prover.wasm public/watcher-prover/
          cp circuits/withdraw/fixture-out/pages-prover/wasm_exec.js public/watcher-prover/
          cp client/watcher/browser-prover.worker.js public/watcher-prover/worker.js
          for name in deposit.r1cs deposit.pk deposit.vk withdraw.r1cs withdraw.pk withdraw.vk manifest.json; do
            cp "circuits/withdraw/fixture-out/pages-prover/$name" public/watcher-prover/assets/
          done
          test -s public/watcher-prover/watcher-prover.wasm
          test -s public/watcher-prover/assets/manifest.json

      - name: Build static Watcher interface
        run: npm run build

      - name: Verify exported persistent runtime and prover paths
        shell: bash
        run: |
          set -euo pipefail
          test -s out/watcher-protocol/devnet.json
          test "$(jq -r '.status' out/watcher-protocol/devnet.json)" = ready
          test -n "$(jq -r '.programId' out/watcher-protocol/devnet.json)"
          test -s out/watcher-prover/worker.js
          test -s out/watcher-prover/wasm_exec.js
          test -s out/watcher-prover/watcher-prover.wasm
          test -s out/watcher-prover/assets/deposit.pk
          test -s out/watcher-prover/assets/withdraw.pk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: watcher-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy matched Watcher interface
        id: deployment
        uses: actions/deploy-pages@v4
