name: Watcher Protocol Program CI

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'programs/watcher-protocol/**'
      - '.github/workflows/watcher-program.yml'
  pull_request:
    paths:
      - 'programs/watcher-protocol/**'
      - '.github/workflows/watcher-program.yml'

permissions:
  contents: read

jobs:
  test-program-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/watcher-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test state machine
        shell: bash
        run: |
          set -o pipefail
          if cargo test --all-targets --locked 2>&1 | tee program-ci.log; then
            exit 0
          fi
          echo '--- retrying without --locked ---' | tee -a program-ci.log
          cargo test --all-targets 2>&1 | tee -a program-ci.log
      - name: Upload program CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-program-ci-log
          path: programs/watcher-protocol/program-ci.log
          if-no-files-found: error
          retention-days: 3
