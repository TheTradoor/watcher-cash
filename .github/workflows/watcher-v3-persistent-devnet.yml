name: Watcher V3 Persistent Devnet - Locked

on:
  workflow_dispatch:
  push:
    branches: [watcher-protocol-v3]
    paths:
      - '.github/v3-deploy-request'

permissions:
  contents: read

concurrency:
  group: watcher-v3-persistent-devnet-locked
  cancel-in-progress: false

env:
  WATCHER_V3_RPC_URL: https://api.devnet.solana.com
  WATCHER_V3_PROGRAM_ID: AyAyADfWVV3ZRUDGgJ9sEeU5GnYdZ9DyW4t3uW49pUHg

jobs:
  verify-sealed-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the persistent V3 deployment is already sealed
        run: |
          set -euo pipefail
          RUNTIME=public/watcher-protocol/v3-devnet.json
          test -s "$RUNTIME"
          test "$(jq -r '.version' "$RUNTIME")" = 3
          test "$(jq -r '.network' "$RUNTIME")" = devnet
          test "$(jq -r '.status' "$RUNTIME")" = ready
          test "$(jq -r '.programId' "$RUNTIME")" = "$WATCHER_V3_PROGRAM_ID"
          test "$(jq -r '.proverBasePath' "$RUNTIME")" = '/watcher-cash/watcher-prover-v3'
          test "$(jq -r '.nullifierShardCount' "$RUNTIME")" = 32
          test "$(jq -r '.nullifierShards | length' "$RUNTIME")" = 32

          success=0
          for attempt in 1 2 3 4 5 6; do
            if node scripts/watcher-v3-runtime-verify.mjs \
              --runtime "$RUNTIME" \
              --rpc "$WATCHER_V3_RPC_URL" \
              --pin public/watcher-protocol/v2-prover-pin.json \
              > /tmp/watcher-v3-sealed-runtime.json; then
              success=1
              cat /tmp/watcher-v3-sealed-runtime.json
              break
            fi
            sleep $((attempt * 5))
          done
          test "$success" = 1

      - name: Require the stored program secret to match the sealed program id
        env:
          PROGRAM_KEYPAIR_B64: ${{ secrets.WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROGRAM_KEYPAIR_B64" || { echo 'Missing WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64.' >&2; exit 1; }
          printf '%s' "$PROGRAM_KEYPAIR_B64" | base64 --decode > /tmp/watcher-v3-locked-program.json
          chmod 600 /tmp/watcher-v3-locked-program.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { Keypair } from '@solana/web3.js';
          const expected = process.env.WATCHER_V3_PROGRAM_ID;
          const value = JSON.parse(fs.readFileSync('/tmp/watcher-v3-locked-program.json', 'utf8'));
          if (!Array.isArray(value) || value.length !== 64) throw new Error('V3 program secret is not a 64-byte keypair');
          const actual = Keypair.fromSecretKey(Uint8Array.from(value)).publicKey.toBase58();
          if (actual !== expected) throw new Error(`V3 program secret resolves to ${actual}, expected ${expected}`);
          console.log(`Sealed V3 program identity verified: ${actual}`);
          NODE

      - name: Confirm no deployment mutation is performed
        run: |
          echo 'Watcher V3 initial public-devnet deployment is sealed.'
          echo 'This workflow intentionally performs no program deploy, no bootstrap, no shard creation, and no state reset.'
          echo 'Any future program upgrade or state migration must use a new reviewed migration workflow with explicit liability guards.'

      - name: Remove temporary key material
        if: always()
        run: rm -f /tmp/watcher-v3-locked-program.json
