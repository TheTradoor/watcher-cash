name: Migrate Watcher UI to Permanent Browser Prover

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/migrate-watcher-browser-prover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply permanent browser prover wiring
        run: |
          python scripts/migrate-watcher-browser-prover.py
          rm -f client/watcher/ui-prover.mjs
          rm -f public/watcher-prover-worker.js

      - name: Validate client and production build
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/browser-prover.worker.js
          test ! -e client/watcher/ui-prover.mjs
          test ! -e public/watcher-prover-worker.js
          npm run build

      - name: Publish permanent browser prover wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/watcher-protocol-page.jsx
          git rm client/watcher/ui-prover.mjs public/watcher-prover-worker.js
          git commit -m 'Use the permanent isolated browser prover stack'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
