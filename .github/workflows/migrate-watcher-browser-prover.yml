name: Migrate Watcher UI to Permanent Browser Prover

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/migrate-watcher-browser-prover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace the parallel UI prover with the permanent worker stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/watcher-protocol-page.jsx')
          source = path.read_text()

          replacements = [
              (
                  "import { createWatcherBrowserProverV1 } from '../client/watcher/ui-prover.mjs';",
                  "import { getBrowserProverV1 } from '../client/watcher/browser-prover.mjs';",
                  'browser prover import',
              ),
              (
                  "fetch(`${BASE_PATH}/watcher-prover-v1/browser-manifest.json`, { cache: 'no-store' })",
                  "fetch(`${BASE_PATH}/watcher-prover/assets/manifest.json`, { cache: 'no-store' })",
                  'browser asset manifest',
              ),
              (
                  """  const ensureProver = useCallback(async () => {
    if (!proverRef.current) {
      proverRef.current = createWatcherBrowserProverV1({
        workerUrl: `${BASE_PATH}/watcher-prover-worker.js`,
        assetBase: `${BASE_PATH}/watcher-prover-v1`,
      });
    }
    setProverStatus('loading');
    const result = await proverRef.current.ready();
    setBundleDigest(result?.bundleDigest || '');
    setProverStatus('ready');
    return proverRef.current;
  }, []);""",
                  """  const ensureProver = useCallback(async () => {
    if (!proverRef.current) {
      proverRef.current = getBrowserProverV1({
        basePath: `${BASE_PATH}/watcher-prover`,
      });
    }
    setProverStatus('loading');
    const result = await proverRef.current.initialize();
    setBundleDigest(result?.bundleDigest || '');
    setProverStatus('ready');
    return proverRef.current;
  }, []);""",
                  'browser prover initialization',
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          rm -f client/watcher/ui-prover.mjs public/watcher-prover-worker.js

      - name: Validate client and production build
        shell: bash
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/browser-prover.worker.js
          test ! -e client/watcher/ui-prover.mjs
          test ! -e public/watcher-prover-worker.js
          ! grep -R "watcher-prover-v1\|watcher-prover-worker.js\|ui-prover.mjs" app client public --exclude-dir=node_modules
          npm run build

      - name: Publish permanent browser prover wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/watcher-protocol-page.jsx client/watcher/ui-prover.mjs public/watcher-prover-worker.js
          git commit -m 'Use the permanent isolated browser prover stack'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
