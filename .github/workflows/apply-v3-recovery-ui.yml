name: Apply V3 Recovery UI

on:
  push:
    branches: [watcher-protocol-v3-recovery-change]
    paths:
      - '.github/workflows/apply-v3-recovery-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v3-recovery-change
          fetch-depth: 0

      - name: Wire encrypted recovery controls into V3 page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/v3/page.jsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import styles from '../v2/v2.module.css';",
              "import VaultBackupControls from './VaultBackupControls';\nimport styles from '../v2/v2.module.css';",
              'backup import',
          )

          replace_once(
              "  async function discardPending(record) {\n    if (record.status !== 'pending') return;\n    await persistRecords(removeNoteRecordV1(records, record.id));\n  }\n",
              "  async function discardPending(record) {\n    if (record.status !== 'pending') return;\n    await persistRecords(removeNoteRecordV1(records, record.id));\n  }\n\n  async function restoreBackupRecords(saved) {\n    const refreshed = await refreshTree({ syncNotes: true, recordsOverride: saved });\n    const synced = refreshed?.records || saved;\n    setRecords(synced);\n    return synced;\n  }\n",
              'restore callback',
          )

          replace_once(
              "      <section className={styles.notes}>\n        <div className={styles.sectionHead}><div><small>ENCRYPTED V3 NOTES</small><strong>{unlocked ? `${confirmedRecords.length} spendable` : 'Locked'}</strong></div></div>\n",
              "      <section className={styles.notes}>\n        <div className={styles.sectionHead}><div><small>ENCRYPTED V3 NOTES</small><strong>{unlocked ? `${confirmedRecords.length} spendable` : 'Locked'}</strong></div></div>\n        <VaultBackupControls\n          unlocked={unlocked}\n          publicKey={publicKey}\n          walletAddress={walletAddress}\n          runtimeScope={runtimeScope}\n          network={runtime?.network || 'devnet'}\n          vaultKey={vaultKey}\n          records={records}\n          onRestored={restoreBackupRecords}\n          onMessage={(value) => { setError(''); setMessage(value); }}\n          onError={(value) => setError(value)}\n        />\n",
              'backup controls mount',
          )

          path.write_text(text)
          PY

      - name: Validate recovery UI patch
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/v3/page.jsx"
          grep -F -q "import VaultBackupControls from './VaultBackupControls';" app/v3/page.jsx
          grep -F -q 'data-v3-backup-controls' app/v3/VaultBackupControls.jsx
          grep -F -q 'onRestored={restoreBackupRecords}' app/v3/page.jsx

      - name: Commit recovery UI wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v3/page.jsx
          git commit -m 'Wire encrypted V3 vault recovery into browser UI'
          git push origin HEAD:watcher-protocol-v3-recovery-change
