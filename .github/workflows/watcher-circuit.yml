name: Watcher Protocol Circuit CI

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'circuits/withdraw/**'
      - '.github/workflows/watcher-circuit.yml'
  pull_request:
    paths:
      - 'circuits/withdraw/**'

permissions:
  contents: write

jobs:
  test-withdraw-circuit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits/withdraw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum
      - name: Resolve modules
        run: go mod tidy
      - name: Test withdrawal and deposit circuits
        run: go test -v ./...
      - name: Generate development withdrawal fixture
        run: go run ./cmd/genfixture
      - name: Export matched withdrawal coordinates
        env:
          WATCHER_EXPORT_COORDS: '1'
        run: go test -run TestExportCoordinateFixture -v
      - name: Export matched deposit coordinates
        env:
          WATCHER_EXPORT_DEPOSIT_COORDS: '1'
        run: go test -run TestExportDepositCoordinateFixtures -v
      - name: Validate coordinate fixtures
        run: |
          python - <<'PY'
          import json

          withdrawal = json.load(open('fixture-out/coordinates.json'))
          assert len(withdrawal['public_inputs']) == 10
          assert len(withdrawal['vk']['ic']) == 11
          assert all(len(value) == 64 for value in withdrawal['proof'].values())
          assert all(len(value) == 64 for value in withdrawal['public_inputs'])

          deposits = [
              json.load(open('fixture-out/deposit_coordinates.json')),
              json.load(open('fixture-out/deposit_coordinates_1.json')),
          ]
          for deposit in deposits:
              assert len(deposit['public_inputs']) == 3
              assert len(deposit['vk']['ic']) == 4
              assert all(len(value) == 64 for value in deposit['proof'].values())
              assert all(len(value) == 64 for value in deposit['public_inputs'])
          assert deposits[0]['vk'] == deposits[1]['vk']

          print('coordinate fixtures valid: withdrawal=10 inputs, deposits=3 inputs each')
          PY
      - name: Build matched xark wire fixtures
        run: |
          python - <<'PY'
          import json
          import pathlib

          base_field_modulus = 21888242871839275222246405745257275088696311157297823662689037894645226208583
          output = pathlib.Path('../../programs/watcher-protocol/src')

          def little_endian(hex_value):
              return bytes.fromhex(hex_value)[::-1]

          def rust_array(value):
              return '[' + ','.join(f'0x{byte:02x}' for byte in value) + ']\n'

          def encode_fixture(source, public_input_count, expected_vk_bytes):
              coordinates = json.load(open(source))
              proof_coordinates = coordinates['proof']
              verifying_key = coordinates['vk']

              negated_a_y = (
                  base_field_modulus - int(proof_coordinates['a_y'], 16)
              ).to_bytes(32, 'little')
              proof = (
                  little_endian(proof_coordinates['a_x'])
                  + negated_a_y
                  + little_endian(proof_coordinates['b_x0'])
                  + little_endian(proof_coordinates['b_x1'])
                  + little_endian(proof_coordinates['b_y0'])
                  + little_endian(proof_coordinates['b_y1'])
                  + little_endian(proof_coordinates['c_x'])
                  + little_endian(proof_coordinates['c_y'])
              )

              vk = little_endian(verifying_key['alpha_x']) + little_endian(verifying_key['alpha_y'])
              for point_name in ('beta', 'gamma', 'delta'):
                  vk += (
                      little_endian(verifying_key[point_name + '_x0'])
                      + little_endian(verifying_key[point_name + '_x1'])
                      + little_endian(verifying_key[point_name + '_y0'])
                      + little_endian(verifying_key[point_name + '_y1'])
                  )
              for point in verifying_key['ic']:
                  vk += little_endian(point['x']) + little_endian(point['y'])

              public_inputs = b''.join(
                  little_endian(value) for value in coordinates['public_inputs']
              )
              assert len(proof) == 256
              assert len(vk) == expected_vk_bytes
              assert len(public_inputs) == 32 * public_input_count
              return proof, vk, public_inputs

          withdrawal_proof, withdrawal_vk, withdrawal_inputs = encode_fixture(
              'fixture-out/coordinates.json', 10, 1152
          )
          deposit_proof_0, deposit_vk_0, deposit_inputs_0 = encode_fixture(
              'fixture-out/deposit_coordinates.json', 3, 704
          )
          deposit_proof_1, deposit_vk_1, deposit_inputs_1 = encode_fixture(
              'fixture-out/deposit_coordinates_1.json', 3, 704
          )
          assert deposit_vk_0 == deposit_vk_1

          (output / 'dev_proof_array.in').write_text(rust_array(withdrawal_proof))
          (output / 'dev_vk_array.in').write_text(rust_array(withdrawal_vk))
          (output / 'dev_public_inputs_array.in').write_text(rust_array(withdrawal_inputs))
          (output / 'dev_deposit_proof_array.in').write_text(rust_array(deposit_proof_0))
          (output / 'dev_deposit_public_inputs_array.in').write_text(rust_array(deposit_inputs_0))
          (output / 'dev_deposit_proof_1_array.in').write_text(rust_array(deposit_proof_1))
          (output / 'dev_deposit_public_inputs_1_array.in').write_text(rust_array(deposit_inputs_1))
          (output / 'dev_deposit_vk_array.in').write_text(rust_array(deposit_vk_0))
          print('built matched withdrawal and two deposit proof/VK/public-input fixtures')
          PY
      - name: Publish matched development verifier fixtures
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            programs/watcher-protocol/src/dev_proof_array.in \
            programs/watcher-protocol/src/dev_vk_array.in \
            programs/watcher-protocol/src/dev_public_inputs_array.in \
            programs/watcher-protocol/src/dev_deposit_proof_array.in \
            programs/watcher-protocol/src/dev_deposit_public_inputs_array.in \
            programs/watcher-protocol/src/dev_deposit_proof_1_array.in \
            programs/watcher-protocol/src/dev_deposit_public_inputs_1_array.in \
            programs/watcher-protocol/src/dev_deposit_vk_array.in
          if git diff --cached --quiet; then
            echo 'fixtures unchanged'
          else
            git commit -m 'Sync matched Circuit V1 verifier fixtures [skip circuit]'
            cp -a circuits/withdraw/testdata /tmp/watcher-testdata
            cp -a circuits/withdraw/fixture-out /tmp/watcher-fixture-out
            git reset --hard HEAD
            git clean -fd
            git fetch origin watcher-protocol
            git rebase origin/watcher-protocol
            git push origin HEAD:watcher-protocol
            mkdir -p circuits/withdraw
            cp -a /tmp/watcher-testdata circuits/withdraw/testdata
            cp -a /tmp/watcher-fixture-out circuits/withdraw/fixture-out
          fi
      - name: Show withdrawal fixture manifest
        run: cat testdata/v1_fixture/manifest.json
      - name: Upload development fixtures
        uses: actions/upload-artifact@v4
        with:
          name: watcher-circuit-v1-dev-fixtures
          path: |
            circuits/withdraw/testdata/v1_fixture/
            circuits/withdraw/fixture-out/coordinates.json
            circuits/withdraw/fixture-out/deposit_coordinates.json
            circuits/withdraw/fixture-out/deposit_coordinates_1.json
          if-no-files-found: error
          retention-days: 7
