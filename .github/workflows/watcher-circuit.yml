name: Watcher Protocol Circuit CI

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'circuits/withdraw/**'
      - '.github/workflows/watcher-circuit.yml'
  pull_request:
    paths:
      - 'circuits/withdraw/**'

permissions:
  contents: write

jobs:
  test-withdraw-circuit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits/withdraw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test -v ./...
      - name: Generate development Groth16 fixture
        run: go run ./cmd/genfixture
      - name: Export coordinate fixture
        env:
          WATCHER_EXPORT_COORDS: '1'
        run: go test -run TestExportCoordinateFixture -v
      - name: Validate coordinate fixture
        run: |
          python - <<'PY'
          import json
          d=json.load(open('fixture-out/coordinates.json'))
          assert len(d['public_inputs']) == 10
          assert len(d['vk']['ic']) == 11
          assert all(len(v)==64 for v in d['proof'].values())
          assert all(len(v)==64 for v in d['public_inputs'])
          print('coordinate fixture valid: 10 inputs, 11 IC points')
          PY
      - name: Build matched xark wire fixture
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.load(open('fixture-out/coordinates.json'))
          q=21888242871839275222246405745257275088696311157297823662689037894645226208583
          def le(h): return bytes.fromhex(h)[::-1]
          def arr(b): return '['+','.join(f'0x{x:02x}' for x in b)+']\n'
          p=d['proof']; v=d['vk']
          ay=(q-int(p['a_y'],16)).to_bytes(32,'little')
          proof=(le(p['a_x'])+ay+le(p['b_x0'])+le(p['b_x1'])+le(p['b_y0'])+le(p['b_y1'])+le(p['c_x'])+le(p['c_y']))
          vk=le(v['alpha_x'])+le(v['alpha_y'])
          for n in ('beta','gamma','delta'):
              vk += le(v[n+'_x0'])+le(v[n+'_x1'])+le(v[n+'_y0'])+le(v[n+'_y1'])
          for pt in v['ic']: vk += le(pt['x'])+le(pt['y'])
          pub=b''.join(le(x) for x in d['public_inputs'])
          assert len(proof)==256 and len(vk)==1152 and len(pub)==320
          root=pathlib.Path('../../programs/watcher-protocol/src')
          (root/'dev_proof_array.in').write_text(arr(proof))
          (root/'dev_vk_array.in').write_text(arr(vk))
          (root/'dev_public_inputs_array.in').write_text(arr(pub))
          print('built one matched proof/VK/public-input fixture')
          PY
      - name: Publish matched development verifier fixture
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/watcher-protocol/src/dev_proof_array.in programs/watcher-protocol/src/dev_vk_array.in programs/watcher-protocol/src/dev_public_inputs_array.in
          if git diff --cached --quiet; then
            echo 'fixture unchanged'
          else
            git commit -m 'Sync matched Circuit V1 verifier fixture [skip circuit]'
            git fetch origin watcher-protocol
            git rebase origin/watcher-protocol
            git push origin HEAD:watcher-protocol
          fi
      - name: Show fixture manifest
        run: cat testdata/v1_fixture/manifest.json
      - name: Upload development fixture
        uses: actions/upload-artifact@v4
        with:
          name: watcher-circuit-v1-dev-fixture
          path: |
            circuits/withdraw/testdata/v1_fixture/
            circuits/withdraw/fixture-out/coordinates.json
          if-no-files-found: error
          retention-days: 7
