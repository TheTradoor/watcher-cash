name: Publish Watcher V2 Overlay to GitHub Pages

on:
  push:
    branches: [watcher-protocol-v2]
    paths:
      - 'app/v2/**'
      - 'client/watcher/**'
      - 'public/watcher-protocol/v2-devnet.json'
      - 'public/watcher-protocol/v2-prover-pin.json'
      - 'scripts/install-pinned-v2-prover.mjs'
      - 'scripts/watcher-v2-runtime-verify.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/pages-v2-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NEXT_PUBLIC_BASE_PATH: /watcher-cash
  NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com

concurrency:
  group: watcher-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable V1 website source
        uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          path: v1

      - name: Checkout V2 overlay source
        uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v2
          path: v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build exact current V1 Pages artifact
        working-directory: v1
        env:
          NEXT_PUBLIC_WATCHER_RUNTIME_URL: /watcher-cash/watcher-protocol/devnet.json
          NEXT_PUBLIC_WATCHER_PROVER_BASE: /watcher-cash/watcher-prover
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

          RUNTIME=public/watcher-protocol/devnet.json
          test -s "$RUNTIME"
          test "$(jq -r '.status' "$RUNTIME")" = ready
          test "$(jq -r '.cluster' "$RUNTIME")" = devnet
          node scripts/watcher-runtime-verify.mjs --runtime "$RUNTIME" --rpc https://api.devnet.solana.com

          rm -rf /tmp/watcher-v1-pages-release /tmp/watcher-v1-pages-extract circuits/withdraw/fixture-out/pages-prover
          mkdir -p /tmp/watcher-v1-pages-release /tmp/watcher-v1-pages-extract circuits/withdraw/fixture-out/pages-prover
          gh release download watcher-dev-prover \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'watcher-development-prover-bundle.tar.gz' \
            --pattern 'watcher-development-prover-bundle.tar.gz.sha256' \
            --dir /tmp/watcher-v1-pages-release
          (cd /tmp/watcher-v1-pages-release && sha256sum --check watcher-development-prover-bundle.tar.gz.sha256)
          ARCHIVE_SHA=$(sha256sum /tmp/watcher-v1-pages-release/watcher-development-prover-bundle.tar.gz | awk '{print $1}')
          test "$ARCHIVE_SHA" = "$(jq -r '.proverBundleSha256' "$RUNTIME")"
          tar -xzf /tmp/watcher-v1-pages-release/watcher-development-prover-bundle.tar.gz -C /tmp/watcher-v1-pages-extract
          BUNDLE_DIR=$(dirname "$(find /tmp/watcher-v1-pages-extract -type f -name deposit.r1cs -print -quit)")
          cp -a "$BUNDLE_DIR/." circuits/withdraw/fixture-out/pages-prover/

          GOOS=js GOARCH=wasm go -C circuits/withdraw build \
            -trimpath -ldflags='-s -w' \
            -o fixture-out/pages-prover/watcher-prover.wasm \
            ./cmd/watcher-prover-wasm
          WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          if [ ! -f "$WASM_EXEC" ]; then WASM_EXEC="$(go env GOROOT)/misc/wasm/wasm_exec.js"; fi
          cp "$WASM_EXEC" circuits/withdraw/fixture-out/pages-prover/wasm_exec.js

          rm -rf public/watcher-prover
          mkdir -p public/watcher-prover/assets
          cp circuits/withdraw/fixture-out/pages-prover/watcher-prover.wasm public/watcher-prover/
          cp circuits/withdraw/fixture-out/pages-prover/wasm_exec.js public/watcher-prover/
          cp client/watcher/browser-prover.worker.js public/watcher-prover/worker.js
          for name in deposit.r1cs deposit.pk deposit.vk withdraw.r1cs withdraw.pk withdraw.vk manifest.json; do
            cp "circuits/withdraw/fixture-out/pages-prover/$name" public/watcher-prover/assets/
          done

          npm run build
          test -s out/index.html
          test -s out/watcher-protocol/devnet.json
          test -s out/watcher-prover/watcher-prover.wasm
          sha256sum out/index.html | tee /tmp/v1-root-before.sha256
          sha256sum out/watcher-protocol/devnet.json | tee /tmp/v1-runtime-before.sha256

      - name: Build only the public V2 overlay artifact
        working-directory: v2
        env:
          NEXT_PUBLIC_WATCHER_V2_RUNTIME_URL: /watcher-cash/watcher-protocol/v2-devnet.json
          NEXT_PUBLIC_WATCHER_V2_PROVER_BASE: /watcher-cash/watcher-prover-v2
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/watcher-v2-runtime-verify.mjs \
            --runtime public/watcher-protocol/v2-devnet.json \
            --rpc https://api.devnet.solana.com \
            --pin public/watcher-protocol/v2-prover-pin.json
          node scripts/install-pinned-v2-prover.mjs
          test -s public/watcher-prover-v2/watcher-v2-prover.wasm
          test -s public/watcher-prover-v2/assets/deposit.pk
          test -s public/watcher-prover-v2/assets/withdraw.pk
          npm run build
          test -s out/v2/index.html
          test -s out/watcher-protocol/v2-devnet.json
          test -s out/watcher-prover-v2/watcher-v2-prover.wasm

      - name: Overlay V2 without mutating V1 root
        shell: bash
        run: |
          set -euo pipefail
          ROOT_BEFORE=$(awk '{print $1}' /tmp/v1-root-before.sha256)
          RUNTIME_BEFORE=$(awk '{print $1}' /tmp/v1-runtime-before.sha256)

          mkdir -p v1/out/_next v1/out/watcher-protocol
          cp -a v2/out/_next/. v1/out/_next/
          rm -rf v1/out/v2 v1/out/watcher-prover-v2
          cp -a v2/out/v2 v1/out/v2
          cp -a v2/out/watcher-prover-v2 v1/out/watcher-prover-v2
          cp v2/out/watcher-protocol/v2-devnet.json v1/out/watcher-protocol/v2-devnet.json
          cp v2/public/watcher-protocol/v2-prover-pin.json v1/out/watcher-protocol/v2-prover-pin.json

          ROOT_AFTER=$(sha256sum v1/out/index.html | awk '{print $1}')
          RUNTIME_AFTER=$(sha256sum v1/out/watcher-protocol/devnet.json | awk '{print $1}')
          test "$ROOT_AFTER" = "$ROOT_BEFORE" || { echo 'V1 root changed during V2 overlay' >&2; exit 1; }
          test "$RUNTIME_AFTER" = "$RUNTIME_BEFORE" || { echo 'V1 runtime changed during V2 overlay' >&2; exit 1; }

          test -s v1/out/v2/index.html
          test -s v1/out/watcher-prover-v2/worker.js
          test -s v1/out/watcher-prover-v2/watcher-v2-prover.wasm
          test "$(jq -r '.programId' v1/out/watcher-protocol/v2-devnet.json)" = 'DMU22YyGkLs9cuZXR6eHt4oZpWtMTMtkCNTNV8SW16HM'

          grep -R -F -q '/watcher-cash/watcher-protocol/v2-devnet.json' v1/out/v2 v1/out/_next || {
            echo 'V2 runtime binding was not emitted into the V2 route/chunks' >&2
            exit 1
          }
          grep -R -F -q '/watcher-cash/watcher-prover-v2' v1/out/v2 v1/out/_next || {
            echo 'V2 prover binding was not emitted into the V2 route/chunks' >&2
            exit 1
          }
          echo "V1 root preserved: $ROOT_AFTER"
          echo "V1 runtime preserved: $RUNTIME_AFTER"
          echo 'V2 overlay assembled successfully.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined V1 + V2 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./v1/out

  deploy:
    environment:
      name: watcher-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V1-preserving V2 overlay
        id: deployment
        uses: actions/deploy-pages@v4
