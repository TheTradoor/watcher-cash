name: Apply Watcher Browser UI Migration

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/patch-watcher-ui.yml'
      - 'config/watcher-index.mjs'
      - 'config/watcher-page-entry.jsx'
      - 'config/watcher-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Replace the legacy page and publish the browser client exports
        run: |
          cp config/watcher-page-entry.jsx app/page.jsx
          cp config/watcher-index.mjs client/watcher/index.mjs
          cp config/watcher-pages.yml .github/workflows/pages.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test browser client
        run: node --test client/watcher/*.test.mjs

      - name: Validate worker and prover builds
        run: |
          node --check public/watcher-prover-worker.js
          cd circuits/withdraw
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover.wasm ./cmd/watcher-prover-wasm

      - name: Build the migrated static site
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: npm run build

      - name: Commit the live route and Pages pipeline
        run: |
          if git diff --quiet; then
            echo 'Watcher browser UI migration is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx client/watcher/index.mjs .github/workflows/pages.yml
          git commit -m 'Wire Watcher browser proofs into the live UI'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
