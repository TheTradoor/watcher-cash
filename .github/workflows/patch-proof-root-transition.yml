name: Patch Proof-Carried Merkle Transitions

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/patch-proof-root-transition.yml'
      - 'scripts/apply-proof-carried-root-transitions.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply proof-carried root transition patch
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-proof-carried-root-transitions.py')
          source = path.read_text()

          old_regex = 'updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)'
          new_regex = 'updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)'
          if old_regex in source:
              source = source.replace(old_regex, new_regex, 1)
          elif new_regex not in source:
              raise SystemExit('replace_regex implementation is not recognized')

          old_first_append = r'''\tcomputedOldRoot, err := merkleRootV1(api, 0, c.Path, c.Index)
\tif err != nil {
\t\treturn err
\t}
\tisFirst := api.IsZero(c.LeafIndex)
\tfor i := 0; i < MerkleDepthV1; i++ {
\t\tapi.AssertIsEqual(api.Mul(isFirst, c.Path[i]), 0)
\t}
\tapi.AssertIsEqual(api.Mul(isFirst, c.OldRoot), 0)
\tapi.AssertIsEqual(
\t\tapi.Mul(api.Sub(1, isFirst), api.Sub(computedOldRoot, c.OldRoot)),
\t\t0,
\t)'''
          new_first_append = r'''\tcomputedOldRoot, err := merkleRootV1(api, 0, c.Path, c.Index)
\tif err != nil {
\t\treturn err
\t}
\tisFirst := api.IsZero(c.LeafIndex)
\temptySibling := frontend.Variable(0)
\tfor i := 0; i < MerkleDepthV1; i++ {
\t\tapi.AssertIsEqual(api.Mul(isFirst, api.Sub(c.Path[i], emptySibling)), 0)
\t\temptySibling, err = hashV1(api, domainMerkleV1, emptySibling, emptySibling)
\t\tif err != nil {
\t\t\treturn err
\t\t}
\t}
\tapi.AssertIsEqual(api.Mul(isFirst, c.OldRoot), 0)
\tapi.AssertIsEqual(
\t\tapi.Mul(api.Sub(1, isFirst), api.Sub(computedOldRoot, c.OldRoot)),
\t\t0,
\t)'''
          if old_first_append in source:
              source = source.replace(old_first_append, new_first_append, 1)
          elif new_first_append not in source:
              raise SystemExit('first-append constraint block is not recognized')

          path.write_text(source)
          PY
          python scripts/apply-proof-carried-root-transitions.py 2>&1 | tee /tmp/root-transition-patch.log

      - name: Format Go and Rust sources
        shell: bash
        run: |
          gofmt -w \
            circuits/withdraw/deposit_v1.go \
            circuits/withdraw/circuit_v1.go \
            circuits/withdraw/deposit_v1_test.go \
            circuits/withdraw/circuit_v1_test.go \
            circuits/withdraw/prover_v1.go \
            circuits/withdraw/prover_v1_test.go \
            circuits/withdraw/cmd/watcher-setup/main.go
          cargo fmt --manifest-path programs/watcher-protocol/Cargo.toml

      - name: Generate the exact matched setup and verifier arrays
        working-directory: circuits/withdraw
        shell: bash
        run: |
          set -o pipefail
          go mod tidy
          rm -rf fixture-out/matched
          go run ./cmd/watcher-setup \
            --bundle-out fixture-out/matched \
            --rust-out ../../programs/watcher-protocol/src \
            2>&1 | tee /tmp/root-transition-setup.log

      - name: Test circuits and reloaded local prover
        working-directory: circuits/withdraw
        shell: bash
        env:
          WATCHER_PROVER_ASSETS: fixture-out/matched
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/root-transition-go-tests.log
          go test -run TestExportedProverBundleRoundTrip -v 2>&1 | tee -a /tmp/root-transition-go-tests.log

      - name: Install web dependencies and test client modules
        shell: bash
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run test:watcher-client 2>&1 | tee /tmp/root-transition-client-tests.log
          node --check client/watcher/merkle.mjs
          node --check client/watcher/witness.mjs
          node --check client/watcher/flows.mjs
          node --check client/watcher/instructions.mjs

      - name: Test the exact generated Solana verifier fixtures
        working-directory: programs/watcher-protocol
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee /tmp/root-transition-rust-tests.log

      - name: Validate generated arities and repository diff
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('circuits/withdraw/fixture-out/matched')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['deposit_public_inputs'] == 6
          assert manifest['withdraw_public_inputs'] == 13
          assert (root / 'sample-deposit-0-proof.bin').stat().st_size == 256
          assert (root / 'sample-deposit-0-public-inputs.bin').stat().st_size == 192
          assert (root / 'sample-withdraw-proof.bin').stat().st_size == 256
          assert (root / 'sample-withdraw-public-inputs.bin').stat().st_size == 416

          fixture = Path('programs/watcher-protocol/src/dev_fixture.rs').read_text()
          assert 'DEV_VK_BYTES: [u8; 1344]' in fixture
          assert 'DEV_PUBLIC_INPUT_BYTES: [u8; 416]' in fixture
          assert 'DEV_DEPOSIT_VK_BYTES: [u8; 896]' in fixture
          assert 'DEV_DEPOSIT_PUBLIC_INPUT_BYTES: [u8; 192]' in fixture

          processor = Path('programs/watcher-protocol/src/processor.rs').read_text()
          for forbidden in ('append_commitment_v1', 'mimc_hash_v1', 'ark_bn254'):
              assert forbidden not in processor, forbidden
          assert 'decoded_inputs.new_root' in processor
          assert 'decoded_inputs.new_merkle_root' in processor
          print('proof-carried root transition shape is valid')
          PY
          git diff --check
          git status --short

      - name: Publish the tested refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No source changes to publish.'
            exit 0
          fi
          git commit -m 'Carry Merkle append roots inside Groth16 proofs'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-root-transition-diagnostics
          path: |
            /tmp/root-transition-patch.log
            /tmp/root-transition-setup.log
            /tmp/root-transition-go-tests.log
            /tmp/root-transition-client-tests.log
            /tmp/root-transition-rust-tests.log
          if-no-files-found: warn
          retention-days: 3
