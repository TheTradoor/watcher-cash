name: Test Watcher Multi-RPC Fee Bootstrap

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/test-watcher-fee-bootstrap-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-and-mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVNET_GENESIS_HASH: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
      PRIVATE_DEVNET_RPC: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol

      - name: Install Agave CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -sSfL \
            https://github.com/anza-xyz/agave/releases/download/v4.0.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            -o /tmp/agave.tar.bz2
          mkdir -p /tmp/agave
          tar -xjf /tmp/agave.tar.bz2 -C /tmp/agave --strip-components=1
          echo "/tmp/agave/bin" >> "$GITHUB_PATH"

      - name: Find a devnet RPC that can bootstrap transaction fees
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PAYER=/tmp/watcher-fee-bootstrap.json
          STATE=/tmp/watcher-fee-bootstrap.env
          solana-keygen new --silent --no-bip39-passphrase --force --outfile "$PAYER"
          ADDRESS=$(solana address --keypair "$PAYER")
          echo "Temporary bootstrap address: $ADDRESS"

          rpc_call() {
            local rpc="$1"
            local method="$2"
            local params="$3"
            curl --connect-timeout 12 --max-time 35 --retry 2 --retry-all-errors \
              --silent --show-error \
              -H 'Content-Type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"${method}\",\"params\":${params}}" \
              "$rpc" || true
          }

          balance_lamports() {
            local rpc="$1"
            local response
            response=$(rpc_call "$rpc" getBalance "[\"$ADDRESS\",{\"commitment\":\"confirmed\"}]")
            jq -r '.result.value // 0' <<<"$response" 2>/dev/null || echo 0
          }

          try_rpc() {
            local label="$1"
            local rpc="$2"
            local genesis
            local response
            local balance

            [ -n "$rpc" ] || return 1
            echo "Checking ${label}"
            response=$(rpc_call "$rpc" getGenesisHash '[]')
            genesis=$(jq -r '.result // empty' <<<"$response" 2>/dev/null || true)
            if [ "$genesis" != "$DEVNET_GENESIS_HASH" ]; then
              echo "${label}: skipped because it is not the expected Solana devnet"
              return 1
            fi

            balance=$(balance_lamports "$rpc")
            balance=${balance:-0}
            if [ "$balance" -ge 10000 ]; then
              printf 'PAYER=%q\nADDRESS=%q\nFUNDED_RPC=%q\nFUNDED_LABEL=%q\n' \
                "$PAYER" "$ADDRESS" "$rpc" "$label" > "$STATE"
              return 0
            fi

            for lamports in 20000 100000 1000000; do
              echo "${label}: requesting ${lamports} lamports"
              response=$(rpc_call "$rpc" requestAirdrop "[\"$ADDRESS\",${lamports},{\"commitment\":\"confirmed\"}]")
              if jq -e '.result | type == "string"' >/dev/null 2>&1 <<<"$response"; then
                echo "${label}: airdrop transaction accepted"
              else
                reason=$(jq -r '.error.message // "request rejected"' <<<"$response" 2>/dev/null || echo 'request rejected')
                echo "${label}: ${reason}"
              fi

              for poll in $(seq 1 8); do
                sleep 2
                balance=$(balance_lamports "$rpc")
                balance=${balance:-0}
                echo "${label}: balance ${balance} lamports"
                if [ "$balance" -ge 10000 ]; then
                  printf 'PAYER=%q\nADDRESS=%q\nFUNDED_RPC=%q\nFUNDED_LABEL=%q\n' \
                    "$PAYER" "$ADDRESS" "$rpc" "$label" > "$STATE"
                  return 0
                fi
              done
            done
            return 1
          }

          funded=0
          if [ -n "${PRIVATE_DEVNET_RPC:-}" ]; then
            try_rpc 'configured repository RPC' "$PRIVATE_DEVNET_RPC" && funded=1 || true
          fi

          if [ "$funded" -ne 1 ]; then
            while IFS='|' read -r label rpc; do
              try_rpc "$label" "$rpc" && { funded=1; break; } || true
            done <<'RPCS'
          Ankr devnet|https://rpc.ankr.com/solana_devnet
          dRPC devnet|https://solana-devnet.drpc.org
          Tatum devnet gateway|https://solana-devnet.gateway.tatum.io
          Triport candidate|https://triport.io/sol
          Solana public devnet|https://api.devnet.solana.com
          RPCS
          fi

          if [ "$funded" -ne 1 ]; then
            rm -f "$PAYER" "$STATE"
            echo 'No tested devnet RPC could provide the initial transaction-fee balance.' >&2
            exit 1
          fi

          # Pass only local paths and public metadata to later steps. The private key
          # never leaves this runner and is deleted after the mining test.
          source "$STATE"
          echo "payer=$PAYER" >> "$GITHUB_OUTPUT"
          echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"
          echo "funded_label=$FUNDED_LABEL" >> "$GITHUB_OUTPUT"
          echo "Fee bootstrap succeeded through: $FUNDED_LABEL"

      - name: Install Rust 1.74 and the Solana proof-of-work client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.74.1 --profile minimal --no-self-update
          cargo +1.74.1 install devnet-pow --version 0.1.4 --locked
          devnet-pow --version

      - name: Prove the bootstrap can grow into a usable devnet balance
        shell: bash
        run: |
          set -euo pipefail
          PAYER='${{ steps.bootstrap.outputs.payer }}'
          ADDRESS='${{ steps.bootstrap.outputs.address }}'
          trap 'rm -f "$PAYER" /tmp/watcher-fee-bootstrap.env' EXIT

          before=$(solana balance "$ADDRESS" --url https://api.devnet.solana.com --lamports | awk '{print $1}')
          echo "Balance before proof-of-work mining: $before lamports"
          test "$before" -ge 5000

          devnet-pow \
            --keypair-path "$PAYER" \
            --url devnet \
            mine \
            --difficulty 3 \
            --reward 0.02 \
            --no-infer \
            --target-lamports 20000000

          after=$(solana balance "$ADDRESS" --url https://api.devnet.solana.com --lamports | awk '{print $1}')
          echo "Balance after proof-of-work mining: $after lamports"
          test "$after" -ge 19000000
