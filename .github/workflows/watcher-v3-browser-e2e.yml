name: Watcher Protocol V3 Phantom Browser E2E

on:
  push:
    branches: [watcher-protocol-v3-browser]
    paths:
      - 'app/v3/**'
      - 'app/providers.jsx'
      - 'app/e2e-wallet.js'
      - 'app/v2/V2WalletTransport.jsx'
      - 'client/watcher/**v2*'
      - 'client/watcher/**v3*'
      - 'client/watcher/vault.mjs'
      - 'client/watcher/index.mjs'
      - 'programs/watcher-protocol/**'
      - 'circuits/withdraw/circuit_v2.go'
      - 'circuits/withdraw/deposit_v2.go'
      - 'circuits/withdraw/prover_v2.go'
      - 'circuits/withdraw/cmd/watcher-v2-setup/**'
      - 'circuits/withdraw/cmd/watcher-v2-prover-wasm/**'
      - 'scripts/watcher-v3-bootstrap.mjs'
      - 'scripts/watcher-v3-browser-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/watcher-v3-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-v3-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: v4.0.0
  WATCHER_V3_RPC_URL: http://127.0.0.1:8899
  WATCHER_V3_E2E_SEED_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare diagnostics directory
        run: mkdir -p .github/v3-browser-e2e

      - name: Install Node and Chromium dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test V3 browser client adapters and packed note sync
        run: >-
          node --test
          client/watcher/instructions-v3.test.mjs
          client/watcher/flows-v3.test.mjs
          client/watcher/vault-v3.test.mjs

      - name: Check V3 browser/bootstrap syntax
        run: |
          node --check scripts/watcher-v3-bootstrap.mjs
          node --check scripts/watcher-v3-browser-e2e.mjs

      - name: Generate exact V2 circuit bundle reused by V3 and matching verifier
        working-directory: circuits/withdraw
        run: |
          set -euo pipefail
          rm -rf fixture-out/v3-browser-e2e
          go run ./cmd/watcher-v2-setup \
            --bundle-out fixture-out/v3-browser-e2e \
            --rust-out ../../programs/watcher-protocol/src/v2
          GOOS=js GOARCH=wasm go build \
            -trimpath \
            -ldflags='-s -w' \
            -o fixture-out/v3-browser-e2e/watcher-v2-prover.wasm \
            ./cmd/watcher-v2-prover-wasm
          WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          if [ ! -f "$WASM_EXEC" ]; then
            WASM_EXEC="$(go env GOROOT)/misc/wasm/wasm_exec.js"
          fi
          cp "$WASM_EXEC" fixture-out/v3-browser-e2e/wasm_exec.js
          test -s fixture-out/v3-browser-e2e/watcher-v2-prover.wasm
          test -s fixture-out/v3-browser-e2e/manifest.json

      - name: Assemble isolated V3 browser prover assets
        run: |
          set -euo pipefail
          rm -rf public/watcher-prover-v3
          mkdir -p public/watcher-prover-v3/assets
          cp circuits/withdraw/fixture-out/v3-browser-e2e/watcher-v2-prover.wasm public/watcher-prover-v3/
          cp circuits/withdraw/fixture-out/v3-browser-e2e/wasm_exec.js public/watcher-prover-v3/
          cp client/watcher/browser-prover-v2.worker.js public/watcher-prover-v3/worker.js
          for name in deposit.r1cs deposit.pk deposit.vk withdraw.r1cs withdraw.pk withdraw.vk manifest.json; do
            cp "circuits/withdraw/fixture-out/v3-browser-e2e/$name" "public/watcher-prover-v3/assets/$name"
          done
          test -s public/watcher-prover-v3/assets/manifest.json

      - name: Install Agave SBF toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            --output /tmp/solana-release.tar.bz2
          mkdir -p /tmp/solana-release
          tar -xjf /tmp/solana-release.tar.bz2 -C /tmp/solana-release --strip-components=1
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
          /tmp/solana-release/bin/solana --version
          /tmp/solana-release/bin/cargo-build-sbf --version

      - name: Build V3-wired SBF program against the same verifying keys
        run: |
          set -euo pipefail
          rm -rf target/deploy
          mkdir -p target/deploy
          cargo build-sbf \
            --arch v3 \
            --manifest-path programs/watcher-protocol/Cargo.toml \
            --sbf-out-dir target/deploy
          test -s target/deploy/watcher_protocol_program.so

      - name: Start isolated validator and deploy Watcher V3
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --force --silent -o /tmp/watcher-v3-browser-payer.json
          solana-keygen new --no-bip39-passphrase --force --silent -o /tmp/watcher-v3-browser-program.json
          solana-test-validator \
            --reset \
            --quiet \
            --ledger /tmp/watcher-v3-browser-ledger \
            > .github/v3-browser-e2e/validator.log 2>&1 &
          echo $! > /tmp/watcher-v3-browser-validator.pid
          for attempt in $(seq 1 60); do
            if solana cluster-version --url "$WATCHER_V3_RPC_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          solana cluster-version --url "$WATCHER_V3_RPC_URL"
          solana airdrop 100 --url "$WATCHER_V3_RPC_URL" --keypair /tmp/watcher-v3-browser-payer.json
          solana program deploy target/deploy/watcher_protocol_program.so \
            --url "$WATCHER_V3_RPC_URL" \
            --keypair /tmp/watcher-v3-browser-payer.json \
            --program-id /tmp/watcher-v3-browser-program.json
          solana address -k /tmp/watcher-v3-browser-program.json > /tmp/watcher-v3-browser-program-id

      - name: Bootstrap V3 runtime, all shards, and fund deterministic Phantom surface
        env:
          WATCHER_V3_PAYER_KEYPAIR: /tmp/watcher-v3-browser-payer.json
          WATCHER_V3_RUNTIME_OUT: public/watcher-protocol/v3-local.json
          WATCHER_V3_PROVER_BASE_PATH: /watcher-prover-v3
          WATCHER_V3_NETWORK: localnet
          WATCHER_V3_RELAYER_FEE_LAMPORTS: '0'
          WATCHER_V3_SHARD_BATCH_SIZE: '4'
        run: |
          set -euo pipefail
          export WATCHER_V3_PROGRAM_ID="$(cat /tmp/watcher-v3-browser-program-id)"
          node scripts/watcher-v3-bootstrap.mjs | tee .github/v3-browser-e2e/runtime.json
          E2E_ADDRESS="$(node --input-type=module - <<'NODE'
          import { Keypair } from '@solana/web3.js';
          const seed = Buffer.from(process.env.WATCHER_V3_E2E_SEED_HEX, 'hex');
          console.log(Keypair.fromSeed(seed).publicKey.toBase58());
          NODE
          )"
          echo "Watcher V3 Phantom-compatible browser wallet: $E2E_ADDRESS"
          solana airdrop 10 "$E2E_ADDRESS" --url "$WATCHER_V3_RPC_URL"
          solana balance "$E2E_ADDRESS" --url "$WATCHER_V3_RPC_URL"

      - name: Build isolated V3 browser UI
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_RPC_URL: http://127.0.0.1:8899
          NEXT_PUBLIC_WATCHER_V3_RUNTIME_URL: /watcher-protocol/v3-local.json
          NEXT_PUBLIC_WATCHER_V3_PROVER_BASE: /watcher-prover-v3
          NEXT_PUBLIC_WATCHER_E2E: '1'
          NEXT_PUBLIC_WATCHER_E2E_PHANTOM: '1'
          NEXT_PUBLIC_WATCHER_E2E_SEED: ${{ env.WATCHER_V3_E2E_SEED_HEX }}
        run: npm run build

      - name: Serve isolated V3 browser UI
        run: |
          python3 -m http.server 3000 --directory out > .github/v3-browser-e2e/site.log 2>&1 &
          echo $! > /tmp/watcher-v3-browser-site.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/v3/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Watcher V3 static site did not become ready' >&2
          exit 1

      - name: Run full V3 Phantom-compatible browser proof and transaction regression
        env:
          WATCHER_V3_E2E_URL: http://127.0.0.1:3000/v3/
          WATCHER_V3_E2E_TIMEOUT_MS: '600000'
          WATCHER_V3_RUNTIME_PATH: public/watcher-protocol/v3-local.json
        run: |
          set -o pipefail
          node scripts/watcher-v3-browser-e2e.mjs 2>&1 | tee .github/v3-browser-e2e/test.log

      - name: Preserve V3 browser failure screenshot
        if: failure()
        run: |
          if test -f /tmp/watcher-v3-browser-e2e-failure.png; then
            cp /tmp/watcher-v3-browser-e2e-failure.png .github/v3-browser-e2e/failure.png
          fi

      - name: Upload V3 browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-v3-browser-e2e-diagnostics
          path: .github/v3-browser-e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated V3 services and remove key material
        if: always()
        run: |
          if test -f /tmp/watcher-v3-browser-site.pid; then
            kill "$(cat /tmp/watcher-v3-browser-site.pid)" || true
          fi
          if test -f /tmp/watcher-v3-browser-validator.pid; then
            kill "$(cat /tmp/watcher-v3-browser-validator.pid)" || true
          fi
          rm -f /tmp/watcher-v3-browser-payer.json /tmp/watcher-v3-browser-program.json /tmp/watcher-v3-browser-program-id
