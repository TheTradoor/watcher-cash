name: Watcher V3 Foreground Regression

on:
  push:
    branches: [watcher-protocol-v3-foreground-fix]
    paths:
      - 'app/v3/**'
      - 'client/watcher/browser-prover-v2.mjs'
      - 'client/watcher/browser-prover-v2.test.mjs'
      - 'client/watcher/**v3*'
      - 'scripts/watcher-v3-browser-e2e.mjs'
      - '.github/workflows/watcher-v3-foreground-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-v3-foreground-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v3-foreground-fix

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify foreground mutex and visible prover state are present
        run: |
          set -euo pipefail
          grep -F -q 'const inFlightRef = useRef(false);' app/v3/page.jsx
          grep -F -q 'if (inFlightRef.current) return;' app/v3/page.jsx
          grep -F -q "setBusy('prepare');" app/v3/page.jsx
          grep -F -q "data-v3-busy={busy || 'idle'}" app/v3/page.jsx
          grep -F -q 'this.lastProgress = null;' client/watcher/browser-prover-v2.mjs
          grep -F -q 'listener(snapshot);' client/watcher/browser-prover-v2.mjs
          if grep -F -q '<V3ProverPrewarm />' app/v3/layout.jsx; then
            echo 'Hidden V3 prewarm is still mounted.' >&2
            exit 1
          fi

      - name: Run proof-surface and packed-state regression tests
        run: >-
          node --test
          client/watcher/browser-prover-v2.test.mjs
          client/watcher/instructions-v3.test.mjs
          client/watcher/flows-v3.test.mjs
          client/watcher/vault-v3.test.mjs

      - name: Build production V3 route against the existing public runtime
        env:
          NEXT_PUBLIC_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
          NEXT_PUBLIC_WATCHER_V3_RUNTIME_URL: /watcher-cash/watcher-protocol/v3-devnet.json
          NEXT_PUBLIC_WATCHER_V3_PROVER_BASE: /watcher-cash/watcher-prover-v3
        run: |
          set -euo pipefail
          npm run build
          test -s out/v3/index.html
          grep -R -F -q '/watcher-cash/watcher-prover-v3' out/v3 out/_next
