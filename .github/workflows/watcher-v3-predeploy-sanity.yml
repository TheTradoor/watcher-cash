name: Watcher V3 Predeploy Sanity

on:
  push:
    branches: [watcher-protocol-v3, watcher-protocol-v3-fast-prover, watcher-protocol-v3-lazy-prover]
    paths:
      - 'app/v3/**'
      - 'client/watcher/**v2*'
      - 'client/watcher/**v3*'
      - 'circuits/withdraw/prover_circuit_v2.go'
      - 'circuits/withdraw/cmd/watcher-v3-prover-wasm/**'
      - 'scripts/watcher-v3-bootstrap.mjs'
      - 'scripts/watcher-v3-runtime-verify.mjs'
      - 'scripts/watcher-v3-public-devnet-smoke.mjs'
      - 'scripts/watcher-v3-live-pages-smoke.mjs'
      - '.github/workflows/watcher-v3-devnet-readiness.yml'
      - '.github/workflows/watcher-v3-persistent-devnet.yml'
      - '.github/workflows/watcher-v3-public-devnet-smoke.yml'
      - '.github/workflows/pages-v3-overlay.yml'
      - '.github/workflows/watcher-v3-predeploy-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-v3-predeploy-sanity-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax-check V3 deploy, smoke, and circuit-scoped prover workers
        run: |
          set -euo pipefail
          node --check scripts/watcher-v3-bootstrap.mjs
          node --check scripts/watcher-v3-runtime-verify.mjs
          node --check scripts/watcher-v3-public-devnet-smoke.mjs
          node --check scripts/watcher-v3-live-pages-smoke.mjs
          node --check client/watcher/browser-prover-v3-fast.worker.js
          if test -f client/watcher/browser-prover-v3-lazy.worker.js; then
            node --check client/watcher/browser-prover-v3-lazy.worker.js
          fi

      - name: Run V2 proof-surface plus V3 browser and packed-state tests
        run: |
          set -euo pipefail
          TESTS=(
            client/watcher/browser-prover-v2.test.mjs
            client/watcher/instructions-v3.test.mjs
            client/watcher/flows-v3.test.mjs
            client/watcher/vault-v3.test.mjs
          )
          if test -f client/watcher/browser-prover-v3.test.mjs; then
            TESTS+=(client/watcher/browser-prover-v3.test.mjs)
          fi
          node --test "${TESTS[@]}"

      - name: Run V3 Rust packed-state tests
        run: cargo test --quiet --manifest-path programs/watcher-protocol/Cargo.toml --lib --locked 'v3::'

      - name: Build production UI with isolated V3 route
        env:
          NEXT_PUBLIC_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
          NEXT_PUBLIC_WATCHER_V3_RUNTIME_URL: /watcher-cash/watcher-protocol/v3-devnet.json
          NEXT_PUBLIC_WATCHER_V3_PROVER_BASE: /watcher-cash/watcher-prover-v3
        run: |
          npm run build
          test -s out/v3/index.html
