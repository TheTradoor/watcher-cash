name: Finalize Loop-Safe Watcher Browser Deployment

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/patch-watcher-pages-loop.yml'
      - 'config/watcher-page-entry-v2.jsx'
      - 'config/watcher-pages-v3.yml'
      - 'config/watcher-ui-ci.yml'
      - 'scripts/harden-watcher-browser-page.mjs'
      - 'scripts/fix-watcher-page-imports-v2.mjs'
      - 'scripts/remove-legacy-privacycash-runtime.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Apply the stable route and loop-safe pipelines
        run: |
          cp config/watcher-page-entry-v2.jsx app/page.jsx
          cp config/watcher-pages-v3.yml .github/workflows/pages.yml
          cp config/watcher-ui-ci.yml .github/workflows/watcher-ui.yml
          node scripts/harden-watcher-browser-page.mjs
          node scripts/fix-watcher-page-imports-v2.mjs
          node scripts/remove-legacy-privacycash-runtime.mjs

      - name: Verify the active runtime is clean-room Watcher code
        run: |
          if grep -R -n -E "from ['\"]privacycash|require\(['\"]privacycash|@lightprotocol/hasher.rs" app client src package.json 2>/dev/null; then
            echo 'legacy Privacy Cash runtime reference remains' >&2
            exit 1
          fi
          if grep -q "from '../client/watcher/index.mjs'" app/watcher-protocol-page.jsx; then
            echo 'Watcher page still imports the client barrel' >&2
            exit 1
          fi
          grep -q "from '../client/watcher/keccak.mjs'" app/watcher-protocol-page.jsx
          grep -q 'paths-ignore:' .github/workflows/pages.yml

      - name: Install the clean dependency graph
        run: npm install --no-audit --no-fund

      - name: Validate browser modules and production export
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          node --test client/watcher/*.test.mjs
          node --check public/watcher-prover-worker.js
          npm run build

      - name: Validate native and WebAssembly prover builds
        working-directory: circuits/withdraw
        run: |
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-prover.wasm

      - name: Commit the verified live migration
        run: |
          if git diff --quiet; then
            echo 'Loop-safe Watcher browser deployment is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            app/page.jsx \
            app/watcher-protocol-page.jsx \
            client \
            src \
            package.json \
            LICENSE_AUDIT.md \
            .github/workflows/pages.yml \
            .github/workflows/watcher-ui.yml
          git commit -m 'Finalize loop-safe Watcher browser proving UI'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
