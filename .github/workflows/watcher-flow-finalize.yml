name: Validate Watcher Private Flow

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/watcher-flow-finalize.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Test complete Watcher client
        run: |
          npm install
          npm run test:watcher-client
          node --check scripts/watcher-devnet-e2e.mjs
      - name: Mark flow ready and remove this one-time workflow
        run: |
          printf '%s\n' \
            'local prover: pass' \
            'transaction builders: pass' \
            'state-derived withdrawal flow: pass' \
            'devnet runner syntax: pass' \
            > client/watcher/.local-prover-ready
          rm -f .github/workflows/watcher-flow-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mark Watcher private flow and devnet runner ready'
          git push origin HEAD:watcher-protocol
