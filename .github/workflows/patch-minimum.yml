name: Patch minimum balance UX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-minimum.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx'); s=p.read_text()
          old="""  const setMaxAmount = () => {\n    if (balance !== null && balance > 0) setAmount(String(balance));\n  };"""
          new="""  const balanceBelowMinimum = mode === 'withdraw' && balance !== null && minimumWithdrawal > 0 && balance < minimumWithdrawal;\n\n  const setMaxAmount = () => {\n    if (balance === null || balance <= 0) return;\n    if (minimumWithdrawal > 0 && balance < minimumWithdrawal) {\n      setStatus(`Private balance is below the ${minimumWithdrawal} ${tokenMeta.label} protocol minimum.`);\n      return;\n    }\n    setAmount(String(balance));\n  };"""
          if old not in s: raise SystemExit('setMax marker missing')
          s=s.replace(old,new,1)
          old2="""                      {minimumWithdrawal > 0 && <small>Protocol minimum: {minimumWithdrawal} {tokenMeta.label}</small>}\n                      {belowMinimum && <small className=\"fee-warning\">Amount is below the current protocol minimum.</small>}"""
          new2="""                      {minimumWithdrawal > 0 && <small>Protocol minimum: {minimumWithdrawal} {tokenMeta.label}</small>}\n                      {balanceBelowMinimum && <small className=\"fee-warning balance-warning\">Your private balance is below the minimum withdrawal. Deposit at least {(minimumWithdrawal - balance).toLocaleString(undefined, { maximumFractionDigits: 6 })} {tokenMeta.label} more before withdrawing.</small>}\n                      {!balanceBelowMinimum && belowMinimum && <small className=\"fee-warning\">Amount is below the current protocol minimum.</small>}"""
          if old2 not in s: raise SystemExit('fee marker missing')
          s=s.replace(old2,new2,1)
          old3="""  const withdrawReady = mode !== 'withdraw' || (relayerStatus === 'online' && estimatedReceive > 0 && !belowMinimum && (balance === null || numericAmount <= balance));"""
          new3="""  const withdrawReady = mode !== 'withdraw' || (relayerStatus === 'online' && !balanceBelowMinimum && estimatedReceive > 0 && !belowMinimum && (balance === null || numericAmount <= balance));"""
          if old3 not in s: raise SystemExit('ready marker missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          css=Path('app/globals.css'); c=css.read_text(); c += "\n.balance-warning{padding:9px 10px!important;border-radius:9px;background:#fff0ee;border:1px solid #ebd0cd;line-height:1.45}.max-button:disabled{opacity:.35;cursor:not-allowed}\n"; css.write_text(c)
          PY
      - name: Commit patch
        run: |
          git config user.name "Watcher Cash Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.jsx app/globals.css
          git commit -m "Improve minimum withdrawal UX"
          git push
