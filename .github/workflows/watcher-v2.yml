name: Watcher Protocol V2 CI

on:
  push:
    branches: [watcher-protocol-v2]
    paths:
      - 'circuits/withdraw/circuit_v2.go'
      - 'circuits/withdraw/circuit_v2_test.go'
      - 'circuits/withdraw/deposit_v2.go'
      - 'circuits/withdraw/deposit_v2_test.go'
      - 'circuits/withdraw/prover_v2.go'
      - 'circuits/withdraw/prover_v2_test.go'
      - 'client/watcher/merkle-v2.mjs'
      - 'client/watcher/selection-v2.mjs'
      - 'client/watcher/v2.test.mjs'
      - 'client/watcher/instructions-v2.mjs'
      - 'client/watcher/instructions-v2.test.mjs'
      - 'client/watcher/bindings-v2.mjs'
      - 'client/watcher/bindings-v2.test.mjs'
      - 'client/watcher/public-inputs-v2.mjs'
      - 'programs/watcher-protocol/src/v2/**'
      - 'programs/watcher-protocol/src/lib.rs'
      - 'WATCHER_PROTOCOL_V2.md'
      - '.github/workflows/watcher-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: circuits/withdraw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum
      - name: Test V2 circuits and browser-prover witness parsing
        run: go test -v -run '^(TestCircuitV2|TestDepositCircuitV2|TestProverV2)' .

  v2-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Test V2 sparse tree, selection, compact wire and bindings
        run: >-
          node --test
          client/watcher/v2.test.mjs
          client/watcher/instructions-v2.test.mjs
          client/watcher/bindings-v2.test.mjs

  v2-program:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test compact V2 codec, public-input reconstruction, roots and nullifier markers
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/watcher-v2-rust.log"
          if cargo test --quiet --manifest-path programs/watcher-protocol/Cargo.toml --lib --locked 'v2::' >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          echo 'V2 Rust test failed. Relevant diagnostics:'
          grep -n -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|failures:|test result:' "$log" || true
          echo '--- tail ---'
          tail -n 120 "$log"
          exit 1
