name: Refresh Watcher Web Lockfile

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'package.json'
      - 'scripts/audit-production.mjs'
      - '.github/workflows/refresh-web-lock.yml'

permissions:
  contents: write

concurrency:
  group: watcher-refresh-web-lock
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify locked install and production audit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:prod
          npm run test:watcher-client

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh locked web dependencies'
          git push origin HEAD:watcher-protocol
