name: Watcher V3 Recovery and Change E2E

on:
  push:
    branches: [watcher-protocol-v3-recovery-change]
    paths:
      - 'app/v3/**'
      - 'client/watcher/backup-v3.mjs'
      - 'client/watcher/backup-v3.test.mjs'
      - 'client/watcher/index.mjs'
      - 'client/watcher/**v2*'
      - 'client/watcher/**v3*'
      - 'scripts/watcher-v3-recovery-change-e2e.mjs'
      - '.github/workflows/watcher-v3-recovery-change-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-v3-recovery-change-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: v4.0.0
  WATCHER_V3_RPC_URL: http://127.0.0.1:8899
  WATCHER_V3_E2E_SEED_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

jobs:
  recovery-change:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v3-recovery-change

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Node and Chromium dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test encrypted V3 backup isolation and existing V3 client state
        run: >-
          node --test
          client/watcher/backup-v3.test.mjs
          client/watcher/browser-prover-v2.test.mjs
          client/watcher/instructions-v3.test.mjs
          client/watcher/flows-v3.test.mjs
          client/watcher/vault-v3.test.mjs

      - name: Syntax-check recovery browser flow
        run: |
          node --check scripts/watcher-v3-recovery-change-e2e.mjs
          node --check client/watcher/browser-prover-v3-fast.worker.js

      - name: Install exact pinned V2/V3 browser proving bundle
        run: |
          set -euo pipefail
          node scripts/install-pinned-v2-prover.mjs
          rm -rf public/watcher-prover-v3
          cp -a public/watcher-prover-v2 public/watcher-prover-v3
          cp client/watcher/browser-prover-v3-fast.worker.js public/watcher-prover-v3/worker.js
          test -s public/watcher-prover-v3/watcher-v2-prover.wasm
          test -s public/watcher-prover-v3/assets/deposit.pk
          test -s public/watcher-prover-v3/assets/withdraw.pk

      - name: Install Agave SBF toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            --output /tmp/solana-release.tar.bz2
          mkdir -p /tmp/solana-release
          tar -xjf /tmp/solana-release.tar.bz2 -C /tmp/solana-release --strip-components=1
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
          solana --version
          cargo-build-sbf --version

      - name: Build V3 SBF against the unchanged public verifying keys
        run: |
          set -euo pipefail
          rm -rf target/recovery-change-deploy
          mkdir -p target/recovery-change-deploy
          cargo build-sbf \
            --arch v3 \
            --manifest-path programs/watcher-protocol/Cargo.toml \
            --sbf-out-dir target/recovery-change-deploy
          test -s target/recovery-change-deploy/watcher_protocol_program.so

      - name: Start isolated validator and deploy V3
        run: |
          set -euo pipefail
          mkdir -p .github/v3-recovery-change
          solana-keygen new --no-bip39-passphrase --force --silent -o /tmp/watcher-v3-recovery-payer.json
          solana-keygen new --no-bip39-passphrase --force --silent -o /tmp/watcher-v3-recovery-program.json
          solana-test-validator --reset --quiet --ledger /tmp/watcher-v3-recovery-ledger > .github/v3-recovery-change/validator.log 2>&1 &
          echo $! > /tmp/watcher-v3-recovery-validator.pid
          for attempt in $(seq 1 60); do
            if solana cluster-version --url "$WATCHER_V3_RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          solana cluster-version --url "$WATCHER_V3_RPC_URL"
          solana airdrop 100 --url "$WATCHER_V3_RPC_URL" --keypair /tmp/watcher-v3-recovery-payer.json
          solana program deploy target/recovery-change-deploy/watcher_protocol_program.so \
            --url "$WATCHER_V3_RPC_URL" \
            --keypair /tmp/watcher-v3-recovery-payer.json \
            --program-id /tmp/watcher-v3-recovery-program.json
          solana address -k /tmp/watcher-v3-recovery-program.json > /tmp/watcher-v3-recovery-program-id

      - name: Bootstrap V3 and fund deterministic Phantom-compatible wallet
        env:
          WATCHER_V3_PAYER_KEYPAIR: /tmp/watcher-v3-recovery-payer.json
          WATCHER_V3_RUNTIME_OUT: public/watcher-protocol/v3-local.json
          WATCHER_V3_PROVER_BASE_PATH: /watcher-prover-v3
          WATCHER_V3_NETWORK: localnet
          WATCHER_V3_RELAYER_FEE_LAMPORTS: '0'
          WATCHER_V3_SHARD_BATCH_SIZE: '4'
        run: |
          set -euo pipefail
          export WATCHER_V3_PROGRAM_ID="$(cat /tmp/watcher-v3-recovery-program-id)"
          node scripts/watcher-v3-bootstrap.mjs | tee .github/v3-recovery-change/runtime.json
          E2E_ADDRESS="$(node --input-type=module - <<'NODE'
          import { Keypair } from '@solana/web3.js';
          const seed = Buffer.from(process.env.WATCHER_V3_E2E_SEED_HEX, 'hex');
          console.log(Keypair.fromSeed(seed).publicKey.toBase58());
          NODE
          )"
          solana airdrop 10 "$E2E_ADDRESS" --url "$WATCHER_V3_RPC_URL"
          solana balance "$E2E_ADDRESS" --url "$WATCHER_V3_RPC_URL"

      - name: Build isolated V3 recovery UI
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_RPC_URL: http://127.0.0.1:8899
          NEXT_PUBLIC_WATCHER_V3_RUNTIME_URL: /watcher-protocol/v3-local.json
          NEXT_PUBLIC_WATCHER_V3_PROVER_BASE: /watcher-prover-v3
          NEXT_PUBLIC_WATCHER_E2E: '1'
          NEXT_PUBLIC_WATCHER_E2E_PHANTOM: '1'
          NEXT_PUBLIC_WATCHER_E2E_SEED: ${{ env.WATCHER_V3_E2E_SEED_HEX }}
        run: |
          npm run build
          test -s out/v3/index.html

      - name: Serve isolated V3 recovery UI
        run: |
          python3 -m http.server 3000 --directory out > .github/v3-recovery-change/site.log 2>&1 &
          echo $! > /tmp/watcher-v3-recovery-site.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/v3/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run destructive backup restore and partial-change browser acceptance
        env:
          WATCHER_V3_E2E_URL: http://127.0.0.1:3000/v3/
          WATCHER_V3_E2E_TIMEOUT_MS: '600000'
          WATCHER_V3_RUNTIME_PATH: public/watcher-protocol/v3-local.json
        run: |
          set -o pipefail
          node scripts/watcher-v3-recovery-change-e2e.mjs 2>&1 | tee .github/v3-recovery-change/test.log

      - name: Preserve failure screenshot
        if: failure()
        run: |
          if test -f /tmp/watcher-v3-recovery-change-failure.png; then
            cp /tmp/watcher-v3-recovery-change-failure.png .github/v3-recovery-change/failure.png
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-v3-recovery-change-diagnostics
          path: .github/v3-recovery-change/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop services and remove key material
        if: always()
        run: |
          if test -f /tmp/watcher-v3-recovery-site.pid; then kill "$(cat /tmp/watcher-v3-recovery-site.pid)" || true; fi
          if test -f /tmp/watcher-v3-recovery-validator.pid; then kill "$(cat /tmp/watcher-v3-recovery-validator.pid)" || true; fi
          rm -f /tmp/watcher-v3-recovery-payer.json /tmp/watcher-v3-recovery-program.json /tmp/watcher-v3-recovery-program-id
