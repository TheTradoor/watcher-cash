name: Validate Final Clean Watcher State

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/watcher-final-clean-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify clean repository shape
        shell: bash
        run: |
          set -euo pipefail
          test ! -e circuits/withdraw/prover_bundle_bytes.go
          test ! -e .github/workflows/migrate-watcher-browser-prover.yml
          test ! -e .github/workflows/patch-proof-root-transition.yml
          test ! -e scripts/apply-proof-carried-root-transitions.py
          test -e WATCHER_BROWSER_ARCHITECTURE.md
          test -e client/watcher/browser-prover.mjs
          test -e client/watcher/browser-prover.worker.js
          ! grep -F "../client/watcher/index.mjs" app/watcher-protocol-page.jsx
          grep -F "connection," app/watcher-protocol-page.jsx
          grep -F "DEPOSIT_PUBLIC_INPUT_COUNT_V1 = 6" client/watcher/witness.mjs
          grep -F "PUBLIC_INPUT_COUNT_V1 = 13" client/watcher/witness.mjs
          grep -F "DEPOSIT_INSTRUCTION_PUBLIC_INPUT_BYTES_V1 = 192" client/watcher/instructions.mjs
          grep -F "WITHDRAW_PUBLIC_INPUT_BYTES_V1 = 416" client/watcher/instructions.mjs

      - name: Test browser client and production build
        shell: bash
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/browser-prover.worker.js
          npm run build

      - name: Test native and WebAssembly prover
        shell: bash
        run: |
          set -euo pipefail
          pushd circuits/withdraw
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-final-clean.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-final-clean.wasm
          popd

      - name: Test Solana program
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path programs/watcher-protocol/Cargo.toml --all-targets

      - name: Remove completed validation workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/watcher-final-clean-validation.yml
          git commit -m 'Remove completed final Watcher validation workflow [skip ci]'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
