name: Clean Temporary Watcher UI Migration Machinery

# Final cleanup pass after the live-registry browser deposit fix.
on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/cleanup-watcher-ui-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate the permanent application before cleanup
        shell: bash
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          test ! -e circuits/withdraw/prover_bundle_bytes.go
          ! grep -F "../client/watcher/index.mjs" app/watcher-protocol-page.jsx
          grep -F "connection," app/watcher-protocol-page.jsx
          grep -F "DEPOSIT_PUBLIC_INPUT_COUNT_V1 = 6" client/watcher/witness.mjs
          grep -F "DEPOSIT_INSTRUCTION_PUBLIC_INPUT_BYTES_V1 = 192" client/watcher/instructions.mjs

          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/browser-prover.worker.js
          npm run build

          pushd circuits/withdraw
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover-cleanup.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-prover-cleanup.wasm
          popd

          cargo test --manifest-path programs/watcher-protocol/Cargo.toml --all-targets

      - name: Normalize permanent workflow references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('.github/workflows/watcher-ui.yml')
          text = ui.read_text()
          text = text.replace(
              "      - 'circuits/withdraw/prover_bundle_bytes.go'\n",
              "      - 'circuits/withdraw/**'\n",
          )
          ui.write_text(text)

          status = Path('.github/workflows/watcher-pages-status.yml')
          text = status.read_text().replace(
              "workflows: ['Deploy Watcher Cash to GitHub Pages']",
              "workflows: ['Deploy Watcher Protocol to GitHub Pages']",
          )
          status.write_text(text)
          PY

      - name: Write permanent browser architecture notes
        shell: bash
        run: |
          cat > WATCHER_BROWSER_ARCHITECTURE.md <<'EOF'
          # Watcher Browser Architecture

          The live Watcher Cash interface is a clean-room Watcher Protocol client.

          ## Private proving boundary

          Deposit and withdrawal witnesses are generated in the browser. Groth16 proving runs inside an isolated Web Worker backed by a Go WebAssembly prover. The worker loads one matched development bundle containing deposit and withdrawal R1CS files, proving keys, and verifying keys. Returned public inputs must match the statement built by the browser byte-for-byte before an instruction can be constructed.

          Deposit proofs carry the append-only transition fields `OldRoot`, `NewRoot`, and `LeafIndex`. The browser reads the current on-chain commitment registry immediately before proving, derives the append path from that state, and encodes six public fields totaling 192 bytes.

          Withdrawal proofs carry thirteen public fields totaling 416 bytes. They bind note membership, nullifiers, value conservation, recipient, deployment context, current root, new root, and change-leaf index.

          ## Solana boundary

          The interface is hard-locked to the Solana devnet genesis hash. It can create fresh program-owned config, commitment, nullifier, and root-history accounts, derive the vault PDA, submit proof-bound deposits, rebuild Merkle paths from live state, and submit recipient-bound withdrawals.

          ## Recovery boundary

          Private note owner and nonce values are not placed in persistent application storage. The interface downloads a recovery JSON before broadcasting a deposit or change-producing withdrawal. Session notes are kept only in `sessionStorage` and can be imported or exported explicitly by the user.

          ## Deployment boundary

          GitHub Pages generates a matched circuit, prover, and verifier bundle, compiles the browser prover to WebAssembly, tests JavaScript, Go, Rust, and SBF surfaces, bootstraps a fresh devnet deployment, and performs a static Next.js production build before deployment.

          ## Security status

          This remains development infrastructure. The current setup is not a production ceremony, the tree is intentionally small, and the system has not received an independent production security audit. Do not use production funds.
          EOF

      - name: Remove migration-only files and stale reports
        shell: bash
        run: |
          rm -rf config
          rm -f \
            .deploy-minimum-ux \
            .deploy-ux-20260827 \
            .github/scripts/patch_merkle_cu.py \
            scripts/apply-browser-prover-go-patch.mjs \
            scripts/apply-compute-safe-merkle.mjs \
            scripts/apply-proof-carried-root-transitions.py \
            scripts/fix-generated-setup-vault.py \
            scripts/fix-proof-root-patcher.py \
            scripts/fix-proof-transition-client-tests.py \
            scripts/fix-watcher-page-imports-v2.mjs \
            scripts/fix-watcher-page-imports-v3.mjs \
            scripts/harden-watcher-browser-page.mjs \
            scripts/patch-watcher-direct-imports.mjs \
            scripts/remove-legacy-privacycash-runtime.mjs \
            .github/workflows/apply-browser-prover-go-patch.yml \
            .github/workflows/patch-merkle-cu.yml \
            .github/workflows/patch-minimum.yml \
            .github/workflows/patch-proof-root-transition.yml \
            .github/workflows/patch-watcher-pages-loop.yml \
            .github/workflows/patch-watcher-pages-loop-v2.yml \
            .github/workflows/patch-watcher-pages-loop-v3.yml \
            .github/workflows/patch-watcher-ui.yml \
            .github/workflows/patch-watcher-ui-v2.yml \
            .github/workflows/patch-watcher-ui-v3.yml \
            .github/workflows/patch-watcher-ui-v4.yml \
            .github/workflows/patch-watcher-ui-v5.yml \
            .github/workflows/patch-watcher-ui-v6.yml \
            .github/workflows/watcher-final-validation.yml \
            .github/workflows/watcher-final-validation-v2.yml \
            .github/workflows/watcher-final-validation-v3.yml \
            .github/workflows/watcher-prover-finalize.yml \
            .github/workflows/watcher-prover-sync-trigger.yml \
            .github/workflows/upgrade-ux.yml \
            .github/workflows/cleanup-watcher-ui-migration.yml \
            WATCHER_FINAL_VALIDATION.md \
            WATCHER_UI_FAILURE.md \
            WATCHER_PAGES_FAILURE.md
          rmdir .github/scripts 2>/dev/null || true

      - name: Confirm only permanent workflow surfaces remain
        shell: bash
        run: |
          set -euo pipefail
          test ! -d config
          test ! -e WATCHER_FINAL_VALIDATION.md
          test ! -e circuits/withdraw/prover_bundle_bytes.go
          for forbidden in \
            .github/workflows/patch-watcher-ui.yml \
            .github/workflows/patch-proof-root-transition.yml \
            scripts/apply-proof-carried-root-transitions.py; do
            test ! -e "$forbidden"
          done
          test -e .github/workflows/pages.yml
          test -e .github/workflows/watcher-browser.yml
          test -e .github/workflows/watcher-ui.yml
          test -e .github/workflows/watcher-program.yml
          test -e .github/workflows/watcher-circuit.yml
          test -e .github/workflows/watcher-client.yml
          git diff --check

      - name: Commit the permanent clean state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean temporary Watcher browser migration machinery'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
