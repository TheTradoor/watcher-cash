name: Watcher Protocol Browser UI CI

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'app/**'
      - 'client/watcher/**'
      - 'circuits/withdraw/**'
      - 'scripts/prepare-browser-prover.sh'
      - 'scripts/test-browser-prover-wasm.mjs'
      - '.github/workflows/watcher-ui.yml'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
  pull_request:
    paths:
      - 'app/**'
      - 'client/watcher/**'
      - 'circuits/withdraw/**'
      - 'scripts/prepare-browser-prover.sh'
      - 'scripts/test-browser-prover-wasm.mjs'
      - '.github/workflows/watcher-ui.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'

permissions:
  contents: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test Watcher browser modules
        run: node --test client/watcher/*.test.mjs

      - name: Validate permanent worker and controller syntax
        run: |
          node --check client/watcher/browser-prover.worker.js
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/ui-flows.mjs

      - name: Test Go prover packages
        working-directory: circuits/withdraw
        run: go test ./...

      - name: Build Watcher prover WebAssembly
        working-directory: circuits/withdraw
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-prover.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-prover.wasm

      - name: Build static browser UI
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: npm run build
