name: Diagnose Watcher Private Flow

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/watcher-flow-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        id: install
        continue-on-error: true
        run: |
          mkdir -p .github/flow-diagnostics
          npm install > .github/flow-diagnostics/install.log 2>&1
      - name: Test flow module
        id: flow
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node --test client/watcher/flow.test.mjs > .github/flow-diagnostics/flow.log 2>&1
      - name: Check devnet runner
        id: script
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node --check scripts/watcher-devnet-e2e.mjs > .github/flow-diagnostics/script.log 2>&1
      - name: Test full client
        id: full
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:watcher-client > .github/flow-diagnostics/full.log 2>&1
      - name: Commit diagnostic markers
        env:
          INSTALL: ${{ steps.install.outcome }}
          FLOW: ${{ steps.flow.outcome }}
          SCRIPT: ${{ steps.script.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.github/flow-diagnostics')
          outcomes = {name.lower(): os.environ.get(name, 'skipped') for name in ['INSTALL', 'FLOW', 'SCRIPT', 'FULL']}
          (root / 'status.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          for name, outcome in outcomes.items():
              marker = root / f'{name}.{outcome}'
              marker.write_text(outcome + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/flow-diagnostics
          git commit -m 'Record Watcher private flow diagnostics'
          git push origin HEAD:watcher-protocol
