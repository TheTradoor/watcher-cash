name: Patch Watcher Merkle CU Path

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/patch-merkle-cu.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher-merkle-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/watcher-merkle-target
      GIT_TERMINAL_PROMPT: '0'
      GIT_EDITOR: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply compute-safe Merkle patch
        run: node scripts/apply-compute-safe-merkle.mjs

      - name: Format and validate patch
        shell: bash
        run: |
          cargo fmt --manifest-path programs/watcher-protocol/Cargo.toml
          cargo test --manifest-path programs/watcher-protocol/Cargo.toml --all-targets
          node --check client/watcher/instructions.mjs
          grep -q 'COMMITMENT_REGISTRY_LEN_V1 = 5 + (32 \* 16) + (32 \* 4)' client/watcher/instructions.mjs
          test -s programs/watcher-protocol/src/mimc_constants_array.in
          test -s programs/watcher-protocol/tests/merkle_frontier.rs
          git diff --check

      - name: Publish compute-safe Merkle append path
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u programs/watcher-protocol client/watcher/instructions.mjs client/watcher/README.md
          git add \
            programs/watcher-protocol/src/mimc_constants_array.in \
            programs/watcher-protocol/tests/merkle_frontier.rs
          git status --short
          if git diff --cached --quiet; then
            echo 'No patch changes to publish.'
            exit 0
          fi
          git commit -m 'Use compile-time MiMC constants and incremental Merkle frontier'
          git fetch origin watcher-protocol
          git rebase origin/watcher-protocol
          git push origin HEAD:watcher-protocol
