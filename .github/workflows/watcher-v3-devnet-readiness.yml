name: Watcher V3 Devnet Readiness

on:
  push:
    branches: [watcher-protocol-v3]
    paths:
      - '.github/workflows/watcher-v3-devnet-readiness.yml'
      - '.github/v3-devnet-readiness-request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-v3-devnet-readiness
  cancel-in-progress: true

env:
  WATCHER_V3_RPC_URL: https://api.devnet.solana.com

jobs:
  readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require shared immutable V2/V3 prover release
        run: |
          set -euo pipefail
          PIN=public/watcher-protocol/v2-prover-pin.json
          test -s "$PIN"
          jq -e '.version == 2 and .status == "pinned-development-setup" and .networkTarget == "solana-devnet"' "$PIN" >/dev/null
          test "$(jq -r '.treeDepth' "$PIN")" = 16
          test "$(jq -r '.maxInputs' "$PIN")" = 4
          URL=$(jq -r '.bundleUrl' "$PIN")
          EXPECTED=$(jq -r '.bundleSha256' "$PIN")
          TAG=$(jq -r '.releaseTag' "$PIN")
          test "${TAG##*-}" = "${EXPECTED:0:16}"
          curl --fail --location --retry 3 --range 0-1023 "$URL" -o /tmp/watcher-v3-release-prefix >/dev/null 2>&1
          test -s /tmp/watcher-v3-release-prefix
          echo "Shared pinned release reachable: $TAG"

      - name: Check deployer balance and exact 32-shard rent budget
        env:
          PAYER_KEYPAIR_B64: ${{ secrets.WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$PAYER_KEYPAIR_B64" ]; then
            echo 'READINESS_BLOCKER=missing WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64' >&2
            exit 1
          fi
          if ! printf '%s' "$PAYER_KEYPAIR_B64" | base64 --decode > /tmp/watcher-v3-readiness-payer.json 2>/dev/null; then
            echo 'READINESS_BLOCKER=WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64 is not valid base64' >&2
            exit 1
          fi
          chmod 600 /tmp/watcher-v3-readiness-payer.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { Connection, Keypair } from '@solana/web3.js';
          const value = JSON.parse(fs.readFileSync('/tmp/watcher-v3-readiness-payer.json', 'utf8'));
          if (!Array.isArray(value) || value.length !== 64) throw new Error('WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64 must decode to a 64-byte keypair');
          const payer = Keypair.fromSecretKey(Uint8Array.from(value));
          const connection = new Connection(process.env.WATCHER_V3_RPC_URL, 'confirmed');
          const [balance, genesisHash, shardRent, configRent, treeRent, vaultRent] = await Promise.all([
            connection.getBalance(payer.publicKey, 'confirmed'),
            connection.getGenesisHash(),
            connection.getMinimumBalanceForRentExemption(8240),
            connection.getMinimumBalanceForRentExemption(100),
            connection.getMinimumBalanceForRentExemption(81),
            connection.getMinimumBalanceForRentExemption(50),
          ]);
          const stateRentEstimate = shardRent * 32 + configRent + treeRent + vaultRent;
          const required = stateRentEstimate + 3_000_000_000;
          console.log(JSON.stringify({
            stage: 'budget',
            payer: payer.publicKey.toBase58(),
            payerBalanceLamports: balance,
            payerBalanceSol: balance / 1e9,
            devnetGenesisHash: genesisHash,
            shardHeaderRentLamports: shardRent,
            allShardHeaderRentLamports: shardRent * 32,
            baseStateRentEstimateLamports: stateRentEstimate,
            readinessRequiredLamports: required,
            readinessRequiredSol: required / 1e9,
            deploymentHeadroomLamports: 3_000_000_000,
            budgetReady: balance >= required,
          }, null, 2));
          if (balance < required) {
            throw new Error(`V3 deployer has ${(balance / 1e9).toFixed(6)} SOL; requires ${(required / 1e9).toFixed(6)} SOL including 32-shard rent plus a 3 SOL deployment buffer`);
          }
          NODE

      - name: Check persistent V3 program identity and V1/V2 isolation
        env:
          PROGRAM_KEYPAIR_B64: ${{ secrets.WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$PROGRAM_KEYPAIR_B64" ]; then
            echo 'READINESS_BLOCKER=missing WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64' >&2
            exit 1
          fi
          if ! printf '%s' "$PROGRAM_KEYPAIR_B64" | base64 --decode > /tmp/watcher-v3-readiness-program.json 2>/dev/null; then
            echo 'READINESS_BLOCKER=WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64 is not valid base64' >&2
            exit 1
          fi
          chmod 600 /tmp/watcher-v3-readiness-program.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { Connection, Keypair, PublicKey } from '@solana/web3.js';
          const value = JSON.parse(fs.readFileSync('/tmp/watcher-v3-readiness-program.json', 'utf8'));
          if (!Array.isArray(value) || value.length !== 64) throw new Error('WATCHER_V3_DEVNET_PROGRAM_KEYPAIR_B64 must decode to a 64-byte keypair');
          const program = Keypair.fromSecretKey(Uint8Array.from(value));
          const forbidden = [];
          for (const path of ['public/watcher-protocol/devnet.json', 'public/watcher-protocol/v2-devnet.json']) {
            try {
              const runtime = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (runtime.programId) forbidden.push(new PublicKey(runtime.programId));
            } catch {}
          }
          if (forbidden.some((other) => program.publicKey.equals(other))) {
            throw new Error('V3 program key resolves to an existing V1/V2 program id; refusing shared program identity');
          }
          const connection = new Connection(process.env.WATCHER_V3_RPC_URL, 'confirmed');
          const programInfo = await connection.getAccountInfo(program.publicKey, 'confirmed');
          if (programInfo && !programInfo.executable) throw new Error('Configured V3 address exists on devnet but is not executable');
          console.log(JSON.stringify({
            stage: 'identity',
            status: 'ready',
            programId: program.publicKey.toBase58(),
            differsFromV1AndV2: true,
            programAlreadyDeployed: Boolean(programInfo?.executable),
          }, null, 2));
          NODE

      - name: Check V3 deployment scripts and exact packed geometry
        run: |
          set -euo pipefail
          node --check scripts/watcher-v3-bootstrap.mjs
          node --check scripts/watcher-v3-runtime-verify.mjs
          node --test client/watcher/instructions-v3.test.mjs client/watcher/flows-v3.test.mjs client/watcher/vault-v3.test.mjs

      - name: Remove readiness key material
        if: always()
        run: rm -f /tmp/watcher-v3-readiness-payer.json /tmp/watcher-v3-readiness-program.json
