name: Stop Broad Combined Pages Build

on:
  push:
    branches: [watcher-protocol-v2]
    paths:
      - '.github/workflows/stop-broad-pages-build.yml'

permissions:
  contents: read

concurrency:
  group: watcher-pages
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Broad combined Pages build superseded by V1-preserving overlay workflow.'
