name: Align Watcher UI Browser Prover Assets

on:
  push:
    branches: [watcher-protocol]
    paths:
      - '.github/workflows/fix-watcher-browser-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watcher-protocol
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - name: Point the page at the permanent prover controller and asset tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/watcher-protocol-page.jsx')
          source = path.read_text()

          replacements = [
              (
                  "import { createWatcherBrowserProverV1 } from '../client/watcher/ui-prover.mjs';",
                  "import { getBrowserProverV1 } from '../client/watcher/browser-prover.mjs';",
                  'browser prover import',
              ),
              (
                  "fetch(`${BASE_PATH}/watcher-prover-v1/browser-manifest.json`, { cache: 'no-store' })",
                  "fetch(`${BASE_PATH}/watcher-prover/assets/manifest.json`, { cache: 'no-store' })",
                  'browser prover manifest URL',
              ),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'{label} is not in the expected state')
              source = source.replace(old, new, 1)

          old_block = """    if (!proverRef.current) {
      proverRef.current = createWatcherBrowserProverV1({
        workerUrl: `${BASE_PATH}/watcher-prover-worker.js`,
        assetBase: `${BASE_PATH}/watcher-prover-v1`,
      });
    }
    setProverStatus('loading');
    const result = await proverRef.current.ready();"""
          new_block = """    if (!proverRef.current) {
      const browserProver = getBrowserProverV1({
        basePath: `${BASE_PATH}/watcher-prover`,
      });
      proverRef.current = {
        ready: () => browserProver.initialize(),
        proveDeposit: (witness, expectedPublicInputs) => browserProver.proveDeposit({
          witness,
          expectedPublicInputs,
        }),
        proveWithdraw: (witness, expectedPublicInputs) => browserProver.proveWithdraw({
          witness,
          expectedPublicInputs,
        }),
        terminate: () => browserProver.terminate(),
      };
    }
    setProverStatus('loading');
    const result = await proverRef.current.ready();"""
          if source.count(old_block) != 1:
              raise SystemExit('browser prover initialization block is not in the expected state')
          source = source.replace(old_block, new_block, 1)
          path.write_text(source)
          PY
          rm -f client/watcher/ui-prover.mjs

      - name: Validate client, static build, native prover, and WebAssembly
        shell: bash
        env:
          NEXT_PUBLIC_WATCHER_BASE_PATH: /watcher-cash
          NEXT_PUBLIC_WATCHER_RPC_URL: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          ! grep -F 'watcher-prover-v1' app/watcher-protocol-page.jsx
          ! grep -F 'watcher-prover-worker.js' app/watcher-protocol-page.jsx
          ! grep -F 'ui-prover.mjs' app/watcher-protocol-page.jsx
          grep -F '/watcher-prover/assets/manifest.json' app/watcher-protocol-page.jsx
          grep -F 'getBrowserProverV1' app/watcher-protocol-page.jsx
          test ! -e client/watcher/ui-prover.mjs

          npm install --no-audit --no-fund
          node --test client/watcher/*.test.mjs
          node --check client/watcher/browser-prover.mjs
          node --check client/watcher/browser-prover.worker.js
          npm run build

          pushd circuits/withdraw
          go test ./...
          GOOS=js GOARCH=wasm go build -trimpath -o /tmp/watcher-browser-assets.wasm ./cmd/watcher-prover-wasm
          test -s /tmp/watcher-browser-assets.wasm
          popd

      - name: Publish the validated browser asset alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/watcher-protocol-page.jsx
          git rm client/watcher/ui-prover.mjs
          git rm .github/workflows/fix-watcher-browser-assets.yml
          git commit -m 'Use the permanent Watcher browser prover asset tree'
          git pull --rebase origin watcher-protocol
          git push origin HEAD:watcher-protocol
