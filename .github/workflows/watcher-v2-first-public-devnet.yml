name: First Watcher V2 Public Devnet Deployment

on:
  push:
    branches: [watcher-protocol-v2]
    paths:
      - '.github/v2-first-public-deploy-request'

permissions:
  contents: write

concurrency:
  group: watcher-v2-first-public-devnet
  cancel-in-progress: false

env:
  SOLANA_VERSION: v4.0.0
  WATCHER_V2_RPC_URL: https://api.devnet.solana.com
  EXPECTED_V2_PROGRAM_ID: DMU22YyGkLs9cuZXR6eHt4oZpWtMTMtkCNTNV8SW16HM

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout isolated V2 branch
        uses: actions/checkout@v4
        with:
          ref: watcher-protocol-v2
          fetch-depth: 0

      - name: Require and decode persistent identities
        env:
          PAYER_KEYPAIR_B64: ${{ secrets.WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64 }}
          PROGRAM_KEYPAIR_B64: ${{ secrets.WATCHER_V2_DEVNET_PROGRAM_KEYPAIR_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAYER_KEYPAIR_B64" || { echo 'Missing WATCHER_DEVNET_DEPLOYER_KEYPAIR_B64' >&2; exit 1; }
          test -n "$PROGRAM_KEYPAIR_B64" || { echo 'Missing WATCHER_V2_DEVNET_PROGRAM_KEYPAIR_B64' >&2; exit 1; }
          printf '%s' "$PAYER_KEYPAIR_B64" | base64 --decode > /tmp/watcher-v2-devnet-payer.json
          printf '%s' "$PROGRAM_KEYPAIR_B64" | base64 --decode > /tmp/watcher-v2-devnet-program.json
          chmod 600 /tmp/watcher-v2-devnet-payer.json /tmp/watcher-v2-devnet-program.json
          python3 - <<'PY'
          import json
          for path in ('/tmp/watcher-v2-devnet-payer.json', '/tmp/watcher-v2-devnet-program.json'):
              value = json.load(open(path))
              if not isinstance(value, list) or len(value) != 64:
                  raise SystemExit(f'{path} must be a 64-byte Solana keypair JSON array')
              if any(not isinstance(item, int) or item < 0 or item > 255 for item in value):
                  raise SystemExit(f'{path} has invalid keypair bytes')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: circuits/withdraw/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install and verify immutable pinned V2 prover
        shell: bash
        run: |
          set -euo pipefail
          test -s public/watcher-protocol/v2-prover-pin.json
          node scripts/install-pinned-v2-prover.mjs | tee /tmp/watcher-v2-pin-install.json
          PIN=public/watcher-protocol/v2-prover-pin.json
          RUST=programs/watcher-protocol/src/v2/development_prover_manifest_v2.json
          test "$(jq -r '.depositVkSha256' "$PIN")" = "$(jq -r '.depositVkSha256' "$RUST")"
          test "$(jq -r '.withdrawVkSha256' "$PIN")" = "$(jq -r '.withdrawVkSha256' "$RUST")"

      - name: Install Agave SBF toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            --output /tmp/solana-release.tar.bz2
          mkdir -p /tmp/solana-release
          tar -xjf /tmp/solana-release.tar.bz2 -C /tmp/solana-release --strip-components=1
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
          /tmp/solana-release/bin/solana --version
          /tmp/solana-release/bin/cargo-build-sbf --version

      - name: Lock first deployment identity and funding
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          PAYER=$(solana address --keypair /tmp/watcher-v2-devnet-payer.json)
          PROGRAM_ID=$(solana address --keypair /tmp/watcher-v2-devnet-program.json)
          test "$PROGRAM_ID" = "$EXPECTED_V2_PROGRAM_ID" || {
            echo "V2 program secret resolves to $PROGRAM_ID, expected $EXPECTED_V2_PROGRAM_ID" >&2
            exit 1
          }
          V1_PROGRAM=$(jq -r '.programId // empty' public/watcher-protocol/devnet.json 2>/dev/null || true)
          test -z "$V1_PROGRAM" || test "$PROGRAM_ID" != "$V1_PROGRAM" || {
            echo 'V2 program id equals live V1; refusing deployment.' >&2
            exit 1
          }
          BALANCE=$(solana balance "$PAYER" --url "$WATCHER_V2_RPC_URL" --lamports | awk '{print $1}')
          if [ "${BALANCE:-0}" -lt 5000000000 ]; then
            echo "V2 deployer has only $BALANCE lamports; at least 5 SOL required." >&2
            exit 1
          fi
          if solana program show "$PROGRAM_ID" --url "$WATCHER_V2_RPC_URL" >/tmp/watcher-v2-existing-program.txt 2>&1; then
            echo 'V2 program is already deployed. This one-shot workflow refuses upgrades.' >&2
            cat /tmp/watcher-v2-existing-program.txt
            exit 1
          fi
          if [ -e public/watcher-protocol/v2-devnet.json ]; then
            echo 'v2-devnet.json already exists. Refusing first-deployment workflow.' >&2
            exit 1
          fi
          echo "payer=$PAYER" >> "$GITHUB_OUTPUT"
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"
          echo "balance=$BALANCE" >> "$GITHUB_OUTPUT"
          echo "First deployment identity: $PROGRAM_ID"
          echo "Deployer balance: $BALANCE lamports"

      - name: Validate V2 source before network write
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            client/watcher/v2.test.mjs \
            client/watcher/instructions-v2.test.mjs \
            client/watcher/bindings-v2.test.mjs \
            client/watcher/browser-prover-v2.test.mjs \
            client/watcher/state-v2.test.mjs \
            client/watcher/public-tree-v2.test.mjs \
            client/watcher/flows-v2.test.mjs \
            client/watcher/vault-v2.test.mjs \
            client/watcher/backup-v2.test.mjs \
            client/watcher/vault.test.mjs
          go -C circuits/withdraw test -run '^(TestCircuitV2|TestDepositCircuitV2|TestProverV2)' .
          cargo test --quiet --manifest-path programs/watcher-protocol/Cargo.toml --lib --locked 'v2::'

      - name: Build V2 SBF and matched CLI prover
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/v2-first-devnet
          mkdir -p target/v2-first-devnet
          cargo build-sbf \
            --arch v3 \
            --manifest-path programs/watcher-protocol/Cargo.toml \
            --sbf-out-dir target/v2-first-devnet
          test -s target/v2-first-devnet/watcher_protocol_program.so
          sha256sum target/v2-first-devnet/watcher_protocol_program.so | tee /tmp/watcher-v2-program-sha256.txt
          go -C circuits/withdraw build -trimpath -o /tmp/watcher-v2-prover ./cmd/watcher-v2-prover
          test -s /tmp/watcher-v2-prover

      - name: Deploy fixed V2 program id to public devnet
        shell: bash
        run: |
          set -euo pipefail
          solana program deploy \
            --url "$WATCHER_V2_RPC_URL" \
            --keypair /tmp/watcher-v2-devnet-payer.json \
            --program-id /tmp/watcher-v2-devnet-program.json \
            target/v2-first-devnet/watcher_protocol_program.so \
            | tee /tmp/watcher-v2-first-deploy.log
          solana program show "$EXPECTED_V2_PROGRAM_ID" --url "$WATCHER_V2_RPC_URL" | tee /tmp/watcher-v2-program-show.txt

      - name: Bootstrap separate persistent V2 state
        shell: bash
        run: |
          set -euo pipefail
          WATCHER_V2_PROGRAM_ID="$EXPECTED_V2_PROGRAM_ID" \
          WATCHER_V2_PAYER_KEYPAIR=/tmp/watcher-v2-devnet-payer.json \
          WATCHER_V2_RPC_URL="$WATCHER_V2_RPC_URL" \
          WATCHER_V2_RUNTIME_OUT=public/watcher-protocol/v2-devnet.json \
          WATCHER_V2_PROVER_BASE_PATH=/watcher-prover-v2 \
          WATCHER_V2_NETWORK=devnet \
          WATCHER_V2_RELAYER_FEE_LAMPORTS=0 \
          node scripts/watcher-v2-bootstrap.mjs \
          | tee /tmp/watcher-v2-first-bootstrap.json

      - name: Seal runtime to pinned prover and exact SBF bytes
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=public/watcher-protocol/v2-devnet.json
          PIN=public/watcher-protocol/v2-prover-pin.json
          PROGRAM_SHA=$(awk '{print $1}' /tmp/watcher-v2-program-sha256.txt)
          UPDATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          TMP=$(mktemp)
          jq \
            --arg status ready \
            --arg programId "$EXPECTED_V2_PROGRAM_ID" \
            --arg proverReleaseTag "$(jq -r '.releaseTag' "$PIN")" \
            --arg proverBundleSha256 "$(jq -r '.bundleSha256' "$PIN")" \
            --arg depositVkSha256 "$(jq -r '.depositVkSha256' "$PIN")" \
            --arg withdrawVkSha256 "$(jq -r '.withdrawVkSha256' "$PIN")" \
            --arg programSha256 "$PROGRAM_SHA" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg updatedAt "$UPDATED_AT" \
            '. + {
              status: $status,
              network: "devnet",
              rpcUrl: "https://api.devnet.solana.com",
              programId: $programId,
              proverBasePath: "/watcher-prover-v2",
              proverReleaseTag: $proverReleaseTag,
              proverBundleSha256: $proverBundleSha256,
              depositVkSha256: $depositVkSha256,
              withdrawVkSha256: $withdrawVkSha256,
              programSha256: $programSha256,
              sourceCommit: $sourceCommit,
              updatedAt: $updatedAt
            }' "$RUNTIME" > "$TMP"
          mv "$TMP" "$RUNTIME"
          node scripts/watcher-v2-runtime-verify.mjs \
            --runtime "$RUNTIME" \
            --rpc "$WATCHER_V2_RPC_URL" \
            --pin "$PIN" \
            | tee /tmp/watcher-v2-first-runtime-verification.json

      - name: Run real public-devnet custody smoke test
        shell: bash
        run: |
          set -euo pipefail
          WATCHER_V2_RPC_URL="$WATCHER_V2_RPC_URL" \
          WATCHER_V2_PROGRAM_ID="$EXPECTED_V2_PROGRAM_ID" \
          WATCHER_V2_PAYER_KEYPAIR=/tmp/watcher-v2-devnet-payer.json \
          WATCHER_V2_PROVER=/tmp/watcher-v2-prover \
          WATCHER_V2_BUNDLE=public/watcher-prover-v2/assets \
          WATCHER_V2_ALLOW_AIRDROP=0 \
          WATCHER_V2_REQUIRED_PAYER_LAMPORTS=1000000000 \
          node scripts/watcher-v2-e2e.mjs \
          | tee /tmp/watcher-v2-first-real-devnet-e2e.log

      - name: Re-verify persistent runtime after smoke test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/watcher-v2-runtime-verify.mjs \
            --runtime public/watcher-protocol/v2-devnet.json \
            --rpc "$WATCHER_V2_RPC_URL" \
            --pin public/watcher-protocol/v2-prover-pin.json \
            | tee /tmp/watcher-v2-first-post-smoke-verification.json

      - name: Publish separate V2 devnet runtime to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/watcher-protocol/v2-devnet.json
          git commit -m 'Publish first persistent Watcher V2 devnet runtime'
          git fetch origin watcher-protocol-v2
          git rebase origin/watcher-protocol-v2
          git push origin HEAD:watcher-protocol-v2

      - name: Upload sanitized first-deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-v2-first-public-devnet-evidence
          path: |
            /tmp/watcher-v2-pin-install.json
            /tmp/watcher-v2-program-sha256.txt
            /tmp/watcher-v2-first-deploy.log
            /tmp/watcher-v2-program-show.txt
            /tmp/watcher-v2-first-bootstrap.json
            /tmp/watcher-v2-first-runtime-verification.json
            /tmp/watcher-v2-first-real-devnet-e2e.log
            /tmp/watcher-v2-first-post-smoke-verification.json
            public/watcher-protocol/v2-devnet.json
            public/watcher-protocol/v2-prover-pin.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove deployment key material
        if: always()
        run: rm -f /tmp/watcher-v2-devnet-payer.json /tmp/watcher-v2-devnet-program.json
