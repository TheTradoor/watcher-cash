name: Watcher Protocol Client CI

on:
  push:
    branches: [watcher-protocol]
    paths:
      - 'client/watcher/**'
      - 'scripts/watcher-devnet-e2e.mjs'
      - 'package.json'
      - '.github/workflows/watcher-client.yml'
  pull_request:
    paths:
      - 'client/watcher/**'
      - 'scripts/watcher-devnet-e2e.mjs'
      - 'package.json'
      - '.github/workflows/watcher-client.yml'

permissions:
  contents: read

jobs:
  test-client-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test registry, proof adapters, instructions, and protocol flows
        run: node --test client/watcher/*.test.mjs
      - name: Parse devnet end-to-end harness
        run: node --check scripts/watcher-devnet-e2e.mjs
