[package]
name = "watcher-protocol-program"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.3.0"
thiserror = "2"
xark-verifier = "0.2.1"

[dev-dependencies]
solana-program-test = "2.3.0"
solana-sdk = "2.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
